            echo
            if { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.verify_model.outcome }}" != "success" ]; } || [ "${{ steps.static_checks.outcome }}" != "success" ] || [ "${{ steps.ui_interaction_contract.outcome }}" != "success" ] || [ "${{ steps.home_ui_contract.outcome }}" != "success" ] || { [[ "${GITHUB_REF_NAME}" == codeb/v1.89-* ]] && [ "${{ steps.v189_paste_matrix_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.xcode_build.outcome }}" != "success" ]; } || { { [[ "${GITHUB_REF_NAME}" == "codeb/v1.87-enterprise-ui" || "${GITHUB_REF_NAME}" == "codeb/v1.88-home-translation-ui" ]] || [[ "${GITHUB_REF_NAME}" == codeb/v1.89-* ]]; } && [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.ui_evidence.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.simulator_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.manga_probe.outcome }}" != "success" ]; }; then
              echo "## Return to Agent B"
              echo "Fix the failed stage above, then push a new commit to the same codeb/... branch. Agent C must discard older run artifacts after a new push."
            else
              echo "## Result"
              if [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ]; then
                echo "Static checks and Xcode build passed. Agent C still needs to inspect the diff, manifest, logs, and available output artifacts."
              else
                echo "Static checks passed. Xcode build was skipped by scope detection; Agent C must not treat this run as Swift/Xcode compile evidence."
              fi
            fi
          } > "$RESULT_ROOT/ci-failure-summary.md"

      - name: Upload CI result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ci-results
          retention-days: 14

      - name: Fail job if checks failed
        if: always()
        shell: bash
        run: |
          if { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.verify_model.outcome }}" != "success" ]; } || [ "${{ steps.static_checks.outcome }}" != "success" ] || [ "${{ steps.ui_interaction_contract.outcome }}" != "success" ] || [ "${{ steps.home_ui_contract.outcome }}" != "success" ] || { [[ "${GITHUB_REF_NAME}" == codeb/v1.89-* ]] && [ "${{ steps.v189_paste_matrix_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.xcode_build.outcome }}" != "success" ]; } || { { [[ "${GITHUB_REF_NAME}" == "codeb/v1.87-enterprise-ui" || "${GITHUB_REF_NAME}" == "codeb/v1.88-home-translation-ui" ]] || [[ "${GITHUB_REF_NAME}" == codeb/v1.89-* ]]; } && [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.ui_evidence.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.simulator_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.manga_probe.outcome }}" != "success" ]; }; then
            echo "CI result bundle uploaded; failing job because at least one required stage failed."
            exit 1
          fi
