      - name: Upload CI result bundle
        id: upload_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ci-results
          retention-days: 14

      - name: Enforce cloud MIT48 parity dependency
        id: koharu_mit48_gate
        if: always()
        shell: bash
        run: |
          if [ "$KOHARU_MIT48_PARITY_REQUIRED" = "true" ]; then
            test "${{ needs.koharu_mit48_reference_parity.result }}" = "success"
          else
            echo "Koharu MIT48 parity is optional for ordinary OCR validation; no parity gate applied."
          fi

      - name: Publish full validation receipt
        if: always() && (steps.ci_scope.outputs.validation_profile == 'full' || steps.ci_scope.outputs.receipt_propagation_allowed == 'true') && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=success
          description="Task-scoped full validation passed"
          if [ "${{ steps.japanese_benchmark_gate.outcome }}" != "success" ]; then
            state=failure
            description="Task-scoped full validation failed: Japanese benchmark contract failed"
          fi
          if [ "${{ steps.ci_scope.outputs.receipt_propagation_allowed }}" = "true" ]; then
            description="Reused successful parent full validation"
          fi
          if [ "$KOHARU_MIT48_PARITY_REQUIRED" = "true" ] && [ "${{ steps.koharu_mit48_gate.outcome }}" != "success" ]; then
            state=failure
            description="Task-scoped full validation failed: Koharu MIT48 cloud parity failed"
          fi
          if { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.verify_model.outcome }}" != "success" ]; } || [ "${{ steps.static_checks.outcome }}" != "success" ] || { [ "${{ steps.ci_scope.outputs.speech_contract_required }}" = "true" ] && [ "${{ steps.speech_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.ui_interaction_contract_required }}" = "true" ] && [ "${{ steps.ui_interaction_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.home_ui_contract_required }}" = "true" ] && [ "${{ steps.home_ui_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.paste_matrix_contract_required }}" = "true" ] && [ "${{ steps.v189_paste_matrix_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.xcode_build.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.ui_evidence_required }}" = "true" ] && [ "${{ steps.ui_evidence.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.simulator_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.manga_probe.outcome }}" != "success" ]; } || [ "${{ steps.upload_results.outcome }}" != "success" ]; then
            state=failure
            description="Task-scoped full validation failed"
          fi
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/statuses/${CI_COMMIT_SHA}" \
            -f state="$state" \
            -f context='AITRANS CI/full-validation' \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail job if checks failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.japanese_benchmark_gate.outcome }}" != "success" ]; then
            echo "Japanese benchmark contract did not pass."
            exit 1
          fi
          if [ "$KOHARU_MIT48_PARITY_REQUIRED" = "true" ] && [ "${{ steps.koharu_mit48_gate.outcome }}" != "success" ]; then
            echo "Cloud Koharu MIT48 parity did not pass."
            exit 1
          fi
          if { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.verify_model.outcome }}" != "success" ]; } || [ "${{ steps.static_checks.outcome }}" != "success" ] || { [ "${{ steps.ci_scope.outputs.speech_contract_required }}" = "true" ] && [ "${{ steps.speech_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.ui_interaction_contract_required }}" = "true" ] && [ "${{ steps.ui_interaction_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.home_ui_contract_required }}" = "true" ] && [ "${{ steps.home_ui_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.paste_matrix_contract_required }}" = "true" ] && [ "${{ steps.v189_paste_matrix_contract.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.xcode_build.outcome }}" != "success" ]; } || { [ "${{ steps.ci_scope.outputs.ui_evidence_required }}" = "true" ] && [ "${{ steps.ui_evidence.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.simulator_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.manga_probe.outcome }}" != "success" ]; } || [ "${{ steps.upload_results.outcome }}" != "success" ]; then
            echo "CI result bundle uploaded; failing job because at least one required stage failed."
            exit 1
          fi

  japanese_benchmark:
    name: Japanese OCR and translation benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v3.280/v3.282/v3.283/v3.284/v3.285/v3.286/v3.287/v3.288/v3.289/v3.290/v3.291/v3.292/v3.293/v3.294/v3.295/v3.296/v3.297/v3.298/v3.299/v3.300/v3.301/v3.302/v3.303/v3.304/v3.305/v3.306/v3.307/v3.308/v3.309/v3.310/v3.311/v3.312/v3.313/v3.314/v3.315/v3.316/v3.317/v3.318/v3.319/v3.320/v3.321/v3.322/v3.323/v3.324/v3.325/v3.326/v3.327/v3.328/v3.329/v3.330/v3.331/v3.332/v3.333/v3.334/v3.335/v3.336/v3.337/v3.338/v3.339/v3.340/v3.341/v3.342/v3.343/v3.344/v3.345/v3.346/v3.347 benchmark schemas and fixtures
        shell: bash
