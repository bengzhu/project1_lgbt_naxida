jobs:
  ci-results:
    name: Build and publish CI result bundle
    needs: [koharu_mit48_reference_parity, japanese_benchmark]
    if: always()
    runs-on: macos-latest
    env:
      SCHEME: AITRANS
      DESTINATION: generic/platform=iOS Simulator
      SIMULATOR_RUNTIME: iOS
      DERIVED_DATA: .derivedData-ci
      RESULT_ROOT: ci-results
      TEST_RESULTS_DIR: ci-results/TestResults
      OUTPUT_COPY_DIR: ci-results/output
      MODEL_CACHE_DIR: .ci-models
      KOHARU_MIT48_PARITY_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_profile == 'full' && inputs.koharu_parity_required == 'true' }}
      MODEL_TAG: model-gemma-3-270m-it-qat-q4_0-v1
      MODEL_ASSET: gemma-3-270m-it-qat-Q4_0.gguf
      MODEL_SHA256: 3626e245220ca4a1c5911eb4010b3ecb7bdbf5bc53c79403c21355354d1e2dc6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Prepare metadata
        id: meta
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$TEST_RESULTS_DIR" "$OUTPUT_COPY_DIR"
          branch="$PR_HEAD_REF"
          if [ -z "$branch" ]; then
            branch="${GITHUB_REF_NAME}"
          fi
          branch_slug="$(echo "$branch" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha:0:12}"
          expected_commit_sha="${{ github.event.inputs.expected_commit_sha }}"
          if [ -n "$expected_commit_sha" ]; then
            expected_commit_sha="$(echo "$expected_commit_sha" | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$expected_commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid expected_commit_sha=$expected_commit_sha" >&2
              exit 1
            fi
            if [ "$expected_commit_sha" != "$commit_sha" ]; then
              echo "workflow_dispatch SHA mismatch: expected=$expected_commit_sha actual=$commit_sha ref=$branch" >&2
              exit 1
            fi
          fi
          requested_validation_profile="${{ github.event.inputs.validation_profile }}"
          if [ -z "$requested_validation_profile" ]; then
            requested_validation_profile="auto"
          fi
          case "$requested_validation_profile" in
            auto|full|fast) ;;
            *)
              echo "Invalid validation_profile=$requested_validation_profile" >&2
              exit 1
              ;;
          esac
          requested_ui_evidence_mode="${{ github.event.inputs.ui_evidence_mode }}"
          if [ -z "$requested_ui_evidence_mode" ]; then
            requested_ui_evidence_mode="skip"
          fi
          case "$requested_ui_evidence_mode" in
            skip|full) ;;
            *)
              echo "Invalid ui_evidence_mode=$requested_ui_evidence_mode" >&2
              exit 1
              ;;
          esac
          requested_probe_mode="${{ github.event.inputs.probe_mode }}"
          if [ -z "$requested_probe_mode" ]; then
            requested_probe_mode="skip"
          fi
          koharu_artifact_release_tag="${{ github.event.inputs.koharu_artifact_release_tag }}"
          koharu_artifact_asset="${{ github.event.inputs.koharu_artifact_asset }}"
          koharu_artifact_sha256="${{ github.event.inputs.koharu_artifact_sha256 }}"
          koharu_artifact_required="${{ github.event.inputs.koharu_artifact_required }}"
          if [ -z "$koharu_artifact_required" ]; then
            koharu_artifact_required="false"
          fi
          case "$koharu_artifact_required" in
            true|false) ;;
            *)
              echo "Invalid koharu_artifact_required=$koharu_artifact_required" >&2
              exit 1
              ;;
          esac
          koharu_parity_required="${{ github.event.inputs.koharu_parity_required }}"
          if [ -z "$koharu_parity_required" ]; then
            koharu_parity_required="false"
          fi
          case "$koharu_parity_required" in
            true|false) ;;
            *)
              echo "Invalid koharu_parity_required=$koharu_parity_required" >&2
              exit 1
              ;;
          esac
          koharu_artifact_requested=false
          if [ -n "$koharu_artifact_release_tag$koharu_artifact_asset$koharu_artifact_sha256" ]; then
            koharu_artifact_requested=true
          fi
          if [ "$koharu_artifact_requested" = "true" ]; then
            if [ -z "$koharu_artifact_release_tag" ] || [ -z "$koharu_artifact_asset" ] || [ -z "$koharu_artifact_sha256" ]; then
              echo "koharu_artifact_release_tag, koharu_artifact_asset, and koharu_artifact_sha256 must be provided together" >&2
              exit 1
            fi
          fi
          if [ "$koharu_artifact_required" = "true" ] && [ "$koharu_artifact_requested" != "true" ]; then
            echo "koharu_artifact_required=true requires a release tag, asset, and sha256" >&2
            exit 1
          fi
          case "$requested_probe_mode" in
            ci-fast)
              probe_timeout_seconds=1800
              probe_stall_timeout_seconds=300
              probe_no_progress_timeout_seconds=180
              ;;
            full)
              probe_timeout_seconds=3600
              probe_stall_timeout_seconds=600
              probe_no_progress_timeout_seconds=300
              ;;
            skip)
              probe_timeout_seconds=0
              probe_stall_timeout_seconds=0
              probe_no_progress_timeout_seconds=0
              ;;
            *)
              echo "Invalid probe_mode=$requested_probe_mode" >&2
              exit 1
              ;;
          esac
          if [ "$koharu_artifact_requested" = "true" ] && [ "$requested_probe_mode" = "skip" ]; then
            echo "Koharu artifact injection requires probe_mode=ci-fast or full so App-side readiness, identity, shadow OCR coverage, and convergence gates can be verified." >&2
            exit 1
          fi
          version="$(python3 scripts/resolve-project-version.py --ref "$branch")"
          artifact_name="aitrans-ci-${version}-${branch_slug}-${short_sha}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          result_bundle="${TEST_RESULTS_DIR}/AITRANS-${version}-${short_sha}.xcresult"
          {
            echo "branch=$branch"
            echo "branch_slug=$branch_slug"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
            echo "artifact_name=$artifact_name"
            echo "result_bundle=$result_bundle"
            echo "requested_validation_profile=$requested_validation_profile"
            echo "requested_ui_evidence_mode=$requested_ui_evidence_mode"
            echo "probe_mode=$requested_probe_mode"
            echo "probe_timeout_seconds=$probe_timeout_seconds"
            echo "probe_stall_timeout_seconds=$probe_stall_timeout_seconds"
            echo "probe_no_progress_timeout_seconds=$probe_no_progress_timeout_seconds"
            echo "koharu_artifact_requested=$koharu_artifact_requested"
            echo "koharu_artifact_required=$koharu_artifact_required"
            echo "koharu_parity_required=$koharu_parity_required"
            echo "koharu_artifact_release_tag=$koharu_artifact_release_tag"
            echo "koharu_artifact_asset=$koharu_artifact_asset"
            echo "koharu_artifact_sha256=$koharu_artifact_sha256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "PROBE_MODE=$requested_probe_mode"
            echo "CI_COMMIT_SHA=$commit_sha"
            echo "PROBE_TIMEOUT_SECONDS=$probe_timeout_seconds"
            echo "PROBE_STALL_TIMEOUT_SECONDS=$probe_stall_timeout_seconds"
            echo "PROBE_NO_PROGRESS_TIMEOUT_SECONDS=$probe_no_progress_timeout_seconds"
            echo "KOHARU_ARTIFACT_RELEASE_TAG=$koharu_artifact_release_tag"
            echo "KOHARU_ARTIFACT_ASSET=$koharu_artifact_asset"
            echo "KOHARU_ARTIFACT_SHA256=$koharu_artifact_sha256"
          } >> "$GITHUB_ENV"

      - name: Prepare CI scope inputs
        id: ci_scope_inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT"
          ci_branch="${{ steps.meta.outputs.branch }}"
          requested_validation_profile="${{ steps.meta.outputs.requested_validation_profile }}"
          requested_probe_mode="${{ steps.meta.outputs.probe_mode }}"
          koharu_artifact_requested="${{ steps.meta.outputs.koharu_artifact_requested }}"
          requested_ui_evidence_mode="${{ steps.meta.outputs.requested_ui_evidence_mode }}"
          before="${{ github.event.pull_request.base.sha }}"
          if [ -z "$before" ]; then
            before="${{ github.event.before }}"
          fi
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          scope_diff_method="none"
          scope_diff_base_sha="$before"
          scope_diff_fallback_used=false
          if [ -n "$before" ] && ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Before commit $before is not present in checkout; attempting targeted fetch."
            if git fetch --no-tags --depth=1 origin "$before" 2>/dev/null; then
              scope_diff_method="targeted_fetch"
            else
              echo "Targeted fetch for before commit $before failed; falling back to full repo file list." >&2
            fi
          fi
          if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            if [ "$scope_diff_method" = "none" ]; then
              scope_diff_method="checkout_before"
            fi
            git diff --name-only "$before" "$CI_COMMIT_SHA" > "$RESULT_ROOT/changed-files.txt"
          else
            scope_diff_method="full_repo_fallback"
            scope_diff_fallback_used=true
            git ls-files > "$RESULT_ROOT/changed-files.txt"
          fi

          candidate_parent_sha=""
          candidate_parent_full_validation_state="not_applicable"
          candidate_incremental_metadata_only=false
          smalldata_parent_sha=""
          smalldata_parent_full_validation_state="not_applicable"
          smalldata_incremental_metadata_only=false
          smalldata_metadata_requires_full_validation=false
          receipt_propagation_allowed=false
          full_validation_state_for() {
            local full_validation_sha="$1"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${full_validation_sha}/status" \
              --jq '[.statuses[] | select(.context == "AITRANS CI/full-validation")][0].state // "missing"' \
              2>/dev/null || echo lookup_failed
          }
          if [[ "$ci_branch" == codeb/* ]]; then
            candidate_parent_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
            if [ -n "$candidate_parent_sha" ]; then
              candidate_parent_full_validation_state="$(full_validation_state_for "$candidate_parent_sha")"
            fi
            if ! grep -Ev '^(AGENTS\.md|README\.md|update_log\.md|md/|metrics/)' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
              candidate_incremental_metadata_only=true
            fi
            if [ "$candidate_parent_full_validation_state" != "success" ] || grep -Fx '.github/workflows/ci-results.yml' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
              echo "Candidate parent receipt is unavailable or CI routing changed; expanding scope to the full candidate diff."
              if git fetch --no-tags --depth=200 origin smalldata_test 2>/dev/null; then
                candidate_base="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || true)"
              else
                candidate_base=""
              fi
              if [ -n "$candidate_base" ]; then
                git diff --name-only "$candidate_base" "$CI_COMMIT_SHA" > "$RESULT_ROOT/changed-files.txt"
                scope_diff_method="candidate_merge_base"
                scope_diff_base_sha="$candidate_base"
              else
                git ls-files > "$RESULT_ROOT/changed-files.txt"
                scope_diff_method="candidate_full_repo_fallback"
                scope_diff_fallback_used=true
              fi
            fi
          fi
          if [ "$ci_branch" = "smalldata_test" ]; then
            smalldata_parent_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
            if [ -n "$smalldata_parent_sha" ]; then
              smalldata_parent_full_validation_state="$(full_validation_state_for "$smalldata_parent_sha")"
            fi
            if ! grep -Ev '^(AGENTS\.md|README\.md|update_log\.md|md/|metrics/)' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
              smalldata_incremental_metadata_only=true
            fi
            if [ "$smalldata_incremental_metadata_only" = "true" ] && [ "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d '[:space:]')" -le 2 ] && [ "$smalldata_parent_full_validation_state" != "success" ]; then
              smalldata_metadata_requires_full_validation=true
            fi
          fi

          cat > "$RESULT_ROOT/ci-scope-inputs.env" <<EOF
          ci_branch=$ci_branch
          requested_validation_profile=$requested_validation_profile
          requested_probe_mode=$requested_probe_mode
          koharu_artifact_requested=$koharu_artifact_requested
          requested_ui_evidence_mode=$requested_ui_evidence_mode
          scope_diff_method=$scope_diff_method
          scope_diff_base_sha=$scope_diff_base_sha
          scope_diff_fallback_used=$scope_diff_fallback_used
          candidate_parent_sha=$candidate_parent_sha
          candidate_parent_full_validation_state=$candidate_parent_full_validation_state
          candidate_incremental_metadata_only=$candidate_incremental_metadata_only
          smalldata_parent_sha=$smalldata_parent_sha
          smalldata_parent_full_validation_state=$smalldata_parent_full_validation_state
          smalldata_incremental_metadata_only=$smalldata_incremental_metadata_only
          smalldata_metadata_requires_full_validation=$smalldata_metadata_requires_full_validation
          receipt_propagation_allowed=$receipt_propagation_allowed
          EOF

      - name: Detect CI scope
        id: ci_scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RESULT_ROOT/ci-scope-inputs.env"

          app_build_changed=false
          speech_contract_required=false
          ui_interaction_contract_required=false
          home_ui_contract_required=false
          paste_matrix_contract_required=false
          koharu_contract_required=false
          workflow_changed=false
          if grep -E '^(AITRANS/|AITRANS\.xcodeproj/|build-apple/|test/|scripts/fixtures/v3214-manga-ocr-runtime-harness\.swift$|scripts/fixtures/v3218-long-page-manga-ocr-runtime-harness\.swift$|scripts/fixtures/v3238-manga-ocr-quad-bbox-fallback-runtime-harness\.swift$|scripts/fixtures/v3239-manga-ocr-bbox-primary-runtime-harness\.swift$|scripts/fixtures/v3245-directional-manga-ocr-crop-runtime-harness\.swift$|scripts/fixtures/v3254-japanese-region-diagnostic-harness\.swift$|scripts/test-v3214-image-japanese-manga-ocr-runtime\.sh$|scripts/test-v3218-image-japanese-long-page-manga-ocr-runtime\.sh$|scripts/test-v3238-image-japanese-quad-bbox-fallback-runtime\.sh$|scripts/test-v3239-image-japanese-manga-ocr-bbox-primary-runtime\.sh$|scripts/test-v3245-image-japanese-directional-manga-ocr-crop-runtime\.sh$|scripts/test-v3254-image-japanese-region-diagnostic-runtime\.sh$|scripts/capture-ui-evidence\.sh$)' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
            app_build_changed=true
          fi
          if grep -Fx '.github/workflows/ci-results.yml' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
