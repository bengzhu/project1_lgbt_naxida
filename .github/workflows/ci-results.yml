name: AITRANS CI Results

on:
  push:
    branches:
      - smalldata_test
      - 'codeb/**'
      - '1.*'
  pull_request:
    branches:
      - smalldata_test
    types:
      - opened
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      validation_profile:
        description: 'Validation profile: auto routes development to full and verified PR/merge follow-ups to fast'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - full
          - fast
      ui_evidence_mode:
        description: 'Runtime UI screenshots: skip by default; full only for substantial UI work'
        required: false
        default: skip
        type: choice
        options:
          - skip
          - full
      probe_mode:
        description: 'Manga probe mode: skip for fast build-only CI, ci-fast/full for probe validation'
        required: false
        default: skip
        type: choice
        options:
          - skip
          - ci-fast
          - full
      expected_commit_sha:
        description: 'Optional exact SHA guard for workflow_dispatch; fails before validation when ref moved'
        required: false
        type: string
      koharu_artifact_release_tag:
        description: 'Optional Release tag containing a real Koharu artifact archive'
        required: false
        type: string
      koharu_artifact_asset:
        description: 'Optional Release asset archive with 1.manifest/textboxes/bubbles/segment_mask JSON'
        required: false
        type: string
      koharu_artifact_sha256:
        description: 'SHA256 for the optional Koharu artifact archive'
        required: false
        type: string
      koharu_artifact_required:
        description: 'Fail when the optional Koharu artifact archive is absent or invalid'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      koharu_parity_required:
        description: 'Optional Koharu MIT48 research parity; false keeps ordinary OCR validation independent'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ci-results-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: write

