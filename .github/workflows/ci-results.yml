            elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              validation_profile="fast"
              validation_reason="pull_request_followup_no_synchronize"
              reused_full_validation_sha="$CI_COMMIT_SHA"
              reused_full_validation_state="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/commits/${reused_full_validation_sha}/status" \
                --jq '[.statuses[] | select(.context == "AITRANS CI/full-validation")][0].state // "missing"' \
                2>/dev/null || echo lookup_failed)"
            elif [[ "$ci_branch" == codeb/* ]]; then
              if [ "$candidate_incremental_metadata_only" = "true" ] && [ "$candidate_parent_full_validation_state" = "success" ]; then
                validation_profile="fast"
                validation_reason="candidate_metadata_followup_reuses_parent_full_validation"
                reused_full_validation_sha="$candidate_parent_sha"
                reused_full_validation_state="$candidate_parent_full_validation_state"
                receipt_propagation_allowed=true
              else
                validation_profile="full"
                validation_reason="candidate_development_push"
              fi
            elif [[ "$ci_branch" == 1.* ]]; then
              validation_profile="full"
              validation_reason="integration_development_push"
            elif [ "$ci_branch" = "smalldata_test" ] && [ "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d '[:space:]')" -gt 2 ]; then
              reused_full_validation_sha="$(git rev-parse HEAD^2)"
              reused_full_validation_state="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/commits/${reused_full_validation_sha}/status" \
                --jq '[.statuses[] | select(.context == "AITRANS CI/full-validation")][0].state // "missing"' \
                2>/dev/null || echo lookup_failed)"
              if [ "$reused_full_validation_state" = "success" ]; then
                validation_profile="fast"
                validation_reason="merge_reuses_successful_candidate_full_validation"
                receipt_propagation_allowed=true
              else
                validation_profile="full"
                validation_reason="merge_missing_successful_candidate_full_validation"
              fi
            elif [ "$ci_branch" = "smalldata_test" ] && [ "$smalldata_incremental_metadata_only" = "true" ] && [ "$smalldata_parent_full_validation_state" = "success" ]; then
