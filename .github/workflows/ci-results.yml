name: AITRANS CI Results

on:
  push:
    branches:
      - smalldata_test
      - 'codeb/**'
      - '1.*'
  workflow_dispatch:
    inputs:
      probe_mode:
        description: 'Manga probe mode: skip for fast build-only CI, ci-fast/full for probe validation'
        required: false
        default: skip
        type: choice
        options:
          - skip
          - ci-fast
          - full
      koharu_artifact_release_tag:
        description: 'Optional Release tag containing a real Koharu artifact archive'
        required: false
        type: string
      koharu_artifact_asset:
        description: 'Optional Release asset archive with 1.manifest/textboxes/bubbles/segment_mask JSON'
        required: false
        type: string
      koharu_artifact_sha256:
        description: 'SHA256 for the optional Koharu artifact archive'
        required: false
        type: string
      koharu_artifact_required:
        description: 'Fail when the optional Koharu artifact archive is absent or invalid'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ci-results-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-results:
    name: Build and publish CI result bundle
    runs-on: macos-latest
    env:
      SCHEME: AITRANS
      DESTINATION: generic/platform=iOS Simulator
      SIMULATOR_RUNTIME: iOS
      DERIVED_DATA: .derivedData-ci
      RESULT_ROOT: ci-results
      TEST_RESULTS_DIR: ci-results/TestResults
      OUTPUT_COPY_DIR: ci-results/output
      MODEL_CACHE_DIR: .ci-models
      MODEL_TAG: model-gemma-3-270m-it-qat-q4_0-v1
      MODEL_ASSET: gemma-3-270m-it-qat-Q4_0.gguf
      MODEL_SHA256: 3626e245220ca4a1c5911eb4010b3ecb7bdbf5bc53c79403c21355354d1e2dc6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEST_RESULTS_DIR" "$OUTPUT_COPY_DIR"
          branch="${GITHUB_REF_NAME}"
          branch_slug="$(echo "$branch" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"
          short_sha="${GITHUB_SHA:0:12}"
          requested_probe_mode="${{ github.event.inputs.probe_mode }}"
          if [ -z "$requested_probe_mode" ]; then
            requested_probe_mode="skip"
          fi
          koharu_artifact_release_tag="${{ github.event.inputs.koharu_artifact_release_tag }}"
          koharu_artifact_asset="${{ github.event.inputs.koharu_artifact_asset }}"
          koharu_artifact_sha256="${{ github.event.inputs.koharu_artifact_sha256 }}"
          koharu_artifact_required="${{ github.event.inputs.koharu_artifact_required }}"
          if [ -z "$koharu_artifact_required" ]; then
            koharu_artifact_required="false"
          fi
          case "$koharu_artifact_required" in
            true|false) ;;
            *)
              echo "Invalid koharu_artifact_required=$koharu_artifact_required" >&2
              exit 1
              ;;
          esac
          koharu_artifact_requested=false
          if [ -n "$koharu_artifact_release_tag$koharu_artifact_asset$koharu_artifact_sha256" ]; then
            koharu_artifact_requested=true
          fi
          if [ "$koharu_artifact_requested" = "true" ]; then
            if [ -z "$koharu_artifact_release_tag" ] || [ -z "$koharu_artifact_asset" ] || [ -z "$koharu_artifact_sha256" ]; then
              echo "koharu_artifact_release_tag, koharu_artifact_asset, and koharu_artifact_sha256 must be provided together" >&2
              exit 1
            fi
          fi
          if [ "$koharu_artifact_required" = "true" ] && [ "$koharu_artifact_requested" != "true" ]; then
            echo "koharu_artifact_required=true requires a release tag, asset, and sha256" >&2
            exit 1
          fi
          case "$requested_probe_mode" in
            ci-fast)
              probe_timeout_seconds=1800
              probe_stall_timeout_seconds=300
              probe_no_progress_timeout_seconds=180
              ;;
            full)
              probe_timeout_seconds=3600
              probe_stall_timeout_seconds=600
              probe_no_progress_timeout_seconds=300
              ;;
            skip)
              probe_timeout_seconds=0
              probe_stall_timeout_seconds=0
              probe_no_progress_timeout_seconds=0
              ;;
            *)
              echo "Invalid probe_mode=$requested_probe_mode" >&2
              exit 1
              ;;
          esac
          if [ "$koharu_artifact_requested" = "true" ] && [ "$requested_probe_mode" = "skip" ]; then
            echo "Koharu artifact injection requires probe_mode=ci-fast or full so App-side readiness, identity, shadow OCR coverage, and convergence gates can be verified." >&2
            exit 1
          fi
          version="unversioned"
          if [[ "$branch" =~ v([0-9]+(\.[0-9]+)*) ]]; then
            version="v${BASH_REMATCH[1]}"
          elif [[ "$branch" =~ ^([0-9]+(\.[0-9]+)*)$ ]]; then
            version="v${BASH_REMATCH[1]}"
          fi
          artifact_name="aitrans-ci-${version}-${branch_slug}-${short_sha}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          result_bundle="${TEST_RESULTS_DIR}/AITRANS-${version}-${short_sha}.xcresult"
          {
            echo "branch=$branch"
            echo "branch_slug=$branch_slug"
            echo "short_sha=$short_sha"
            echo "version=$version"
            echo "artifact_name=$artifact_name"
            echo "result_bundle=$result_bundle"
            echo "probe_mode=$requested_probe_mode"
            echo "probe_timeout_seconds=$probe_timeout_seconds"
            echo "probe_stall_timeout_seconds=$probe_stall_timeout_seconds"
            echo "probe_no_progress_timeout_seconds=$probe_no_progress_timeout_seconds"
            echo "koharu_artifact_requested=$koharu_artifact_requested"
            echo "koharu_artifact_required=$koharu_artifact_required"
            echo "koharu_artifact_release_tag=$koharu_artifact_release_tag"
            echo "koharu_artifact_asset=$koharu_artifact_asset"
            echo "koharu_artifact_sha256=$koharu_artifact_sha256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "PROBE_MODE=$requested_probe_mode"
            echo "PROBE_TIMEOUT_SECONDS=$probe_timeout_seconds"
            echo "PROBE_STALL_TIMEOUT_SECONDS=$probe_stall_timeout_seconds"
            echo "PROBE_NO_PROGRESS_TIMEOUT_SECONDS=$probe_no_progress_timeout_seconds"
            echo "KOHARU_ARTIFACT_RELEASE_TAG=$koharu_artifact_release_tag"
            echo "KOHARU_ARTIFACT_ASSET=$koharu_artifact_asset"
            echo "KOHARU_ARTIFACT_SHA256=$koharu_artifact_sha256"
          } >> "$GITHUB_ENV"

      - name: Detect CI scope
        id: ci_scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT"
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          scope_diff_method="none"
          scope_diff_base_sha="$before"
          scope_diff_fallback_used=false
          if [ -n "$before" ] && ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Before commit $before is not present in checkout; attempting targeted fetch."
            if git fetch --no-tags --depth=1 origin "$before" 2>/dev/null; then
              scope_diff_method="targeted_fetch"
            else
              echo "Targeted fetch for before commit $before failed; falling back to full repo file list." >&2
            fi
          fi
          if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            if [ "$scope_diff_method" = "none" ]; then
              scope_diff_method="checkout_before"
            fi
            git diff --name-only "$before" "$GITHUB_SHA" > "$RESULT_ROOT/changed-files.txt"
          else
            scope_diff_method="full_repo_fallback"
            scope_diff_fallback_used=true
            git ls-files > "$RESULT_ROOT/changed-files.txt"
          fi

          xcode_build_required=false
          xcode_build_skip_reason="non_app_build_related_fast_path"
          if [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ]; then
            xcode_build_required=true
            xcode_build_skip_reason=""
          elif [ "${{ steps.meta.outputs.koharu_artifact_requested }}" = "true" ]; then
            xcode_build_required=true
            xcode_build_skip_reason=""
          elif grep -E '^(AITRANS/|AITRANS\.xcodeproj/|build-apple/|test/|scripts/capture-ui-evidence\.sh$)' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
            xcode_build_required=true
            xcode_build_skip_reason=""
          elif grep -Fx '.github/workflows/ci-results.yml' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
            if [ "$scope_diff_fallback_used" = "true" ] || git diff "$scope_diff_base_sha" "$GITHUB_SHA" -- .github/workflows/ci-results.yml | grep -E '^[+-].*(ui_evidence|UI evidence|uiEvidence|capture-ui-evidence)' >/dev/null; then
              xcode_build_required=true
              xcode_build_skip_reason=""
            fi
          fi

          koharu_validator_extended_required=false
          if [ "${{ steps.meta.outputs.koharu_artifact_requested }}" = "true" ] || grep -E '^(scripts/validate-koharu-artifacts\.py|md/koharu研究/artifact_contract/)' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
            koharu_validator_extended_required=true
          elif grep -Fx '.github/workflows/ci-results.yml' "$RESULT_ROOT/changed-files.txt" >/dev/null; then
            if [ "$scope_diff_fallback_used" = "true" ] || git diff "$scope_diff_base_sha" "$GITHUB_SHA" -- .github/workflows/ci-results.yml | grep -E '^[+-].*(KOHARU_ARTIFACT_|koharu_artifact_(release|asset|sha)|Prepare Koharu active artifacts|scripts/validate-koharu-artifacts\.py --)' | grep -Ev '^[+-].*grep -E' >/dev/null; then
              koharu_validator_extended_required=true
            fi
          fi

          {
            echo "xcode_build_required=$xcode_build_required"
            echo "xcode_build_skip_reason=$xcode_build_skip_reason"
            echo "koharu_validator_extended_required=$koharu_validator_extended_required"
            echo "scope_diff_method=$scope_diff_method"
            echo "scope_diff_base_sha=$scope_diff_base_sha"
            echo "scope_diff_fallback_used=$scope_diff_fallback_used"
          } >> "$GITHUB_OUTPUT"
          {
            echo "XCODE_BUILD_REQUIRED=$xcode_build_required"
            echo "XCODE_BUILD_SKIP_REASON=$xcode_build_skip_reason"
            echo "KOHARU_VALIDATOR_EXTENDED_REQUIRED=$koharu_validator_extended_required"
            echo "SCOPE_DIFF_METHOD=$scope_diff_method"
            echo "SCOPE_DIFF_BASE_SHA=$scope_diff_base_sha"
            echo "SCOPE_DIFF_FALLBACK_USED=$scope_diff_fallback_used"
          } >> "$GITHUB_ENV"
          echo "Changed files:"
          cat "$RESULT_ROOT/changed-files.txt"
          echo "scope_diff_method=$scope_diff_method"
          echo "scope_diff_base_sha=$scope_diff_base_sha"
          echo "scope_diff_fallback_used=$scope_diff_fallback_used"
          echo "xcode_build_required=$xcode_build_required"
          echo "koharu_validator_extended_required=$koharu_validator_extended_required"

      - name: Restore GGUF model cache
        id: gguf_cache
        if: steps.meta.outputs.probe_mode != 'skip'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: gguf-${{ env.MODEL_TAG }}-${{ env.MODEL_SHA256 }}

      - name: Download GGUF from GitHub Release
        id: download_model
        if: steps.meta.outputs.probe_mode != 'skip' && steps.gguf_cache.outputs.cache-hit != 'true'
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_CACHE_DIR"
          {
            echo "Downloading $MODEL_ASSET from release $MODEL_TAG"
            gh release download "$MODEL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$MODEL_ASSET" \
              --dir "$MODEL_CACHE_DIR"
          } 2>&1 | tee "$RESULT_ROOT/model-download.log"

      - name: Verify GGUF model
        id: verify_model
        if: steps.meta.outputs.probe_mode != 'skip'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          model_path="$MODEL_CACHE_DIR/$MODEL_ASSET"
          {
            echo "cache-hit=${{ steps.gguf_cache.outputs.cache-hit }}"
            test -f "$model_path"
            echo "$MODEL_SHA256  $model_path" | shasum -a 256 -c -
            du -h "$model_path"
          } 2>&1 | tee "$RESULT_ROOT/model-verify.log"

      - name: Save GGUF model cache
        if: steps.meta.outputs.probe_mode != 'skip' && steps.gguf_cache.outputs.cache-hit != 'true' && steps.verify_model.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: gguf-${{ env.MODEL_TAG }}-${{ env.MODEL_SHA256 }}

      - name: Prepare Koharu active artifacts
        id: koharu_artifacts
        if: steps.meta.outputs.koharu_artifact_requested == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/koharu-artifact-archive"
          extract_dir="$RUNNER_TEMP/koharu-artifact-extract"
          archive_path="$archive_dir/${KOHARU_ARTIFACT_ASSET}"
          mkdir -p "$archive_dir" "$extract_dir" "$RESULT_ROOT"

          fail_or_skip() {
            reason="$1"
            echo "status=$reason" >> "$GITHUB_OUTPUT"
            echo "injected=false" >> "$GITHUB_OUTPUT"
            echo "Koharu artifact injection failed: $reason" >&2
            if [ "${{ steps.meta.outputs.koharu_artifact_required }}" = "true" ]; then
              exit 1
            fi
            exit 0
          }

          {
            echo "Downloading Koharu artifact $KOHARU_ARTIFACT_ASSET from release $KOHARU_ARTIFACT_RELEASE_TAG"
            gh release download "$KOHARU_ARTIFACT_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$KOHARU_ARTIFACT_ASSET" \
              --dir "$archive_dir"
            test -f "$archive_path"
            echo "$KOHARU_ARTIFACT_SHA256  $archive_path" | shasum -a 256 -c -
            case "$KOHARU_ARTIFACT_ASSET" in
              *.zip)
                unzip -q "$archive_path" -d "$extract_dir"
                ;;
              *.tar.gz|*.tgz)
                tar -xzf "$archive_path" -C "$extract_dir"
                ;;
              *.tar)
                tar -xf "$archive_path" -C "$extract_dir"
                ;;
              *)
                echo "unsupported archive type: $KOHARU_ARTIFACT_ASSET" >&2
                exit 42
                ;;
            esac
            python3 - "$extract_dir" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          extract_dir = Path(sys.argv[1])
          destination = Path("test/koharu_artifacts")
          required = [
              "1.manifest.json",
              "1.textboxes.json",
              "1.bubbles.json",
              "1.segment_mask.json",
          ]
          candidate_dirs = []
          for candidate in sorted({path.parent for path in extract_dir.rglob("1.manifest.json") if path.is_file()}):
              if all((candidate / name).is_file() for name in required):
                  candidate_dirs.append(candidate)
          if len(candidate_dirs) != 1:
              details = ", ".join(str(path.relative_to(extract_dir)) for path in candidate_dirs) or "none"
              raise SystemExit(f"expected exactly one Koharu artifact directory containing the four-file contract, found {len(candidate_dirs)}: {details}")
          source_dir = candidate_dirs[0]
          print(f"Koharu artifact source directory: {source_dir.relative_to(extract_dir)}")
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True, exist_ok=True)
          for name in required:
              shutil.copy2(source_dir / name, destination / name)
          PY
            python3 scripts/validate-koharu-artifacts.py --root test/koharu_artifacts > "$RESULT_ROOT/koharu-active-artifacts-validation.json"
            cat "$RESULT_ROOT/koharu-active-artifacts-validation.json"
            python3 - <<'PY'
          import json
          with open("ci-results/koharu-active-artifacts-validation.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          if data.get("verdict") != "readyForShadowOCR":
              raise SystemExit(f"injected Koharu artifact verdict={data.get('verdict')!r}; expected readyForShadowOCR")
          if data.get("readyForShadowOCR") is not True or data.get("externalTextBoxesShadowOCRAllowed") is not True:
              raise SystemExit(f"injected Koharu artifact is not shadow-OCR ready: {data}")
          identity = data.get("artifactIdentitySummary") or {}
          source_image = identity.get("sourceImage") or {}
          declared_sha = identity.get("sourceImageSHA256Declared")
          actual_sha = source_image.get("sha256")
          if identity.get("sourceImageSHA256Matches") is not True or declared_sha != actual_sha:
              raise SystemExit(f"injected Koharu artifact source image SHA mismatch: {identity}")
          PY
          } 2>&1 | tee "$RESULT_ROOT/koharu-artifact-injection.log" || fail_or_skip "download_or_validation_failed"

          echo "status=injected" >> "$GITHUB_OUTPUT"
          echo "injected=true" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Static checks
        id: static_checks
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Static checks"
            git diff --check
            python3 -B scripts/test-speech-recognition-contract.py
            bash -n scripts/capture-ui-evidence.sh
            python3 -m json.tool test/1.ground_truth.json >/dev/null
            if [ -f output/probe_report.json ]; then
              python3 -m json.tool output/probe_report.json >/dev/null
            else
              echo "output/probe_report.json not present; skipping existing output parse"
            fi
            if [ -f output/clean_text_diagnostic.json ]; then
              python3 -m json.tool output/clean_text_diagnostic.json >/dev/null
            else
              echo "output/clean_text_diagnostic.json not present; skipping existing clean text parse"
            fi
            python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/valid > "$RESULT_ROOT/koharu-valid-fixture-validation.json"
            python3 - <<'PY'
          import json
          with open("ci-results/koharu-valid-fixture-validation.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          identity = data.get("artifactIdentitySummary") or {}
          source_image = identity.get("sourceImage") or {}
          files = identity.get("artifactFiles") or {}
          if data.get("verdict") != "contractExampleOnly":
              raise SystemExit(f"valid fixture verdict={data.get('verdict')!r}")
          if identity.get("contractExampleOnly") is not True:
              raise SystemExit(f"valid fixture identity missing contractExampleOnly: {identity}")
          declared_sha = identity.get("sourceImageSHA256Declared")
          actual_sha = source_image.get("sha256")
          if len(str(actual_sha or "")) != 64:
              raise SystemExit(f"valid fixture source image sha missing: {identity}")
          if identity.get("sourceImageSHA256Matches") is not True or declared_sha != actual_sha:
              raise SystemExit(f"valid fixture declared source image sha mismatch: {identity}")
          for key in ["manifest", "TextBoxes", "BubbleMask", "SegmentMask"]:
              item = files.get(key) or {}
              if item.get("exists") is not True or len(str(item.get("sha256") or "")) != 64:
                  raise SystemExit(f"valid fixture missing file identity {key}: {identity}")
          PY
            if python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/valid --package-release-archive "$RUNNER_TEMP/koharu-fixture-refuse.zip" >/tmp/koharu-fixture-refuse.out 2>/tmp/koharu-fixture-refuse.err; then
              echo "contractExampleOnly fixture package unexpectedly allowed without --allow-fixture-package" >&2
              exit 1
            fi
            python3 scripts/validate-koharu-artifacts.py \
              --root md/koharu研究/artifact_contract/examples/valid \
              --package-release-archive "$RUNNER_TEMP/koharu-fixture-package.zip" \
              --allow-fixture-package \
              --emit-handoff-packet \
              --release-tag "fixture tag" \
              --release-asset "koharu fixture package.zip" \
              > "$RESULT_ROOT/koharu-package-fixture-smoke.json"
            python3 - "$RUNNER_TEMP/koharu-fixture-package.zip" <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          archive_path = Path(sys.argv[1])
          with zipfile.ZipFile(archive_path, "r") as archive:
              names = archive.namelist()
          roots = {name.split("/")[0] for name in names if "/" in name}
          files = {name.split("/", 1)[1] for name in names if "/" in name}
          expected = {"1.manifest.json", "1.textboxes.json", "1.bubbles.json", "1.segment_mask.json"}
          if len(roots) != 1 or files != expected:
              raise SystemExit(f"unexpected package layout roots={roots} files={files}")
          with open("ci-results/koharu-package-fixture-smoke.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          packet = data.get("handoffPacket") or {}
          release_archive = packet.get("releaseArchive") or {}
          release_archive_inspection = release_archive.get("inspection") or {}
          upload_command = packet.get("ghReleaseUploadCommand") or ""
          dispatch_command = packet.get("ghWorkflowDispatchCommand") or ""
          run_list_command = packet.get("ghRunListCommand") or ""
          run_watch_command = packet.get("ghRunWatchCommand") or ""
          run_download_command = packet.get("ghRunDownloadCommand") or ""
          ci_result_review = packet.get("ciResultReview") or {}
          if packet.get("handoffReadyForReleaseUpload") is not False:
              raise SystemExit(f"fixture package must not be release-ready: {packet}")
          if packet.get("releaseArchiveInspectionPassed") is not True:
              raise SystemExit(f"fixture package missing release archive inspection proof: {packet}")
          if release_archive_inspection.get("candidateDirectoryCount") != 1 or release_archive_inspection.get("verdict") != "contractExampleOnly":
              raise SystemExit(f"fixture archive inspection proof mismatch: {release_archive_inspection}")
          if not packet.get("inspectReleaseArchiveCommand"):
              raise SystemExit(f"handoff packet missing inspect command: {packet}")
          if not (packet.get("expectedCIManifestEcho") or {}).get("koharuArtifactIdentityReconciliationMatch.matchVerdict"):
              raise SystemExit(f"handoff packet missing expected CI manifest echo: {packet}")
          if "gh release upload 'fixture tag'" not in upload_command or "--repo Altman-sam114/x113451" not in upload_command:
              raise SystemExit(f"release upload command missing repo or quoted tag: {upload_command}")
          if "'koharu_artifact_release_tag=fixture tag'" not in dispatch_command or "'koharu_artifact_asset=koharu fixture package.zip'" not in dispatch_command:
              raise SystemExit(f"workflow dispatch command did not quote spaced inputs: {dispatch_command}")
          if "--repo Altman-sam114/x113451" not in dispatch_command or "--repo Altman-sam114/x113451" not in run_list_command:
              raise SystemExit(f"handoff commands missing repo: dispatch={dispatch_command} run_list={run_list_command}")
          if "<run-id>" not in run_watch_command or "--exit-status" not in run_watch_command:
              raise SystemExit(f"handoff packet missing run watch command: {run_watch_command}")
          if "<run-id>" not in run_download_command or "/private/tmp/aitrans-koharu-handoff-<run-id>" not in run_download_command:
              raise SystemExit(f"handoff packet missing run download command: {run_download_command}")
          if not (packet.get("releaseArchive") or {}).get("sha256"):
              raise SystemExit(f"package smoke missing archive sha: {packet}")
          expected_identity_echo = packet.get("expectedCIManifestIdentityEcho") or {}
          if not expected_identity_echo.get("koharuArtifactValidationIdentitySummaryExpected"):
              raise SystemExit(f"handoff packet missing structured identity echo: {packet}")
          if len(packet.get("expectedCloudIdentityRows") or []) < 5:
              raise SystemExit(f"handoff packet missing cloud identity rows: {packet}")
          manifest_assertions = packet.get("expectedCIManifestAssertions") or []
          manifest_paths = {assertion.get("jsonPath") for assertion in manifest_assertions}
          for expected_path in ["workflowName", "repository", "eventName", "probeMode", "koharuArtifactInjected", "koharuArtifactValidation.verdict", "xcodeBuildRequired"]:
              if expected_path not in manifest_paths:
                  raise SystemExit(f"handoff packet missing manifest assertion {expected_path}: {manifest_assertions}")
          app_runtime_assertions = packet.get("expectedAppRuntimeAssertions") or []
          if not any(assertion.get("jsonPath") == "externalArtifactReadinessReport.artifactIdentityReceipt.identityVerdict" for assertion in app_runtime_assertions):
              raise SystemExit(f"handoff packet missing App runtime assertion: {app_runtime_assertions}")
          if not any(assertion.get("jsonPath") == "koharuArtifactIdentityReconciliationReport.readyForCIManifestComparison" for assertion in packet.get("expectedReconciliationAssertions") or []):
              raise SystemExit(f"handoff packet missing reconciliation assertion: {packet}")
          if not any(assertion.get("jsonPath") == "externalTextBoxShadowOCRSummary.ocrSucceededCount" for assertion in packet.get("expectedExternalShadowOCRAssertions") or []):
              raise SystemExit(f"handoff packet missing external shadow OCR assertion: {packet}")
          if not any(assertion.get("jsonPath") == "koharuArtifactConvergenceGateSummary.externalShadowCoverageGate.id" for assertion in packet.get("expectedConvergenceAssertions") or []):
              raise SystemExit(f"handoff packet missing convergence assertion: {packet}")
          if not (packet.get("expectedProbeTextNeedles") or []):
              raise SystemExit(f"handoff packet missing probe text needles: {packet}")
          if not any(assertion.get("jsonPath") == "probeMode" and assertion.get("operator") == "!=" for assertion in packet.get("staleRunRejectionAssertions") or []):
              raise SystemExit(f"handoff packet missing structured stale run rejection assertion: {packet}")
          required_files = set(ci_result_review.get("requiredResultFiles") or [])
          for expected_file in ["ci-artifact-manifest.json", "junit.xml", "xcodebuild.log", "ci-failure-summary.md"]:
              if expected_file not in required_files:
                  raise SystemExit(f"CI result review missing required file {expected_file}: {ci_result_review}")
          probe_files = set(ci_result_review.get("requiredProbeOutputFilesWhenProbeRuns") or [])
          for expected_probe_file in ["output/probe_report.json", "output/clean_text_diagnostic.json", "output/1_ocr_probe_text.txt", "output/1_debug_boxes.png", "output/1_translated_overlay.png"]:
              if expected_probe_file not in probe_files:
                  raise SystemExit(f"CI result review missing probe output file {expected_probe_file}: {ci_result_review}")
          identity_checks = ci_result_review.get("manifestIdentityChecks") or {}
          for expected_key in ["workflowName", "branch", "commitSha", "runId", "runAttempt", "probeMode", "koharuArtifactReleaseTag", "koharuArtifactAsset", "koharuArtifactSha256"]:
              if expected_key not in identity_checks:
                  raise SystemExit(f"CI result review missing manifest identity key {expected_key}: {identity_checks}")
          if identity_checks.get("probeMode") != "ci-fast" or identity_checks.get("koharuArtifactReleaseTag") != "fixture tag":
              raise SystemExit(f"CI result review manifest identity mismatch: {identity_checks}")
          required_koharu_checks = ci_result_review.get("requiredKoharuChecks") or []
          if not any("ocrSucceededCount > 0" in check for check in required_koharu_checks):
              raise SystemExit(f"CI result review missing shadow OCR success check: {ci_result_review}")
          stale_rules = ci_result_review.get("staleArtifactRejectionRules") or []
          if not any("commitSha" in rule for rule in stale_rules):
              raise SystemExit(f"CI result review missing stale artifact rejection rule: {ci_result_review}")
          if not any("probe_mode=skip" in rule for rule in stale_rules) or not any("releaseArchive.inspection" in rule for rule in stale_rules):
              raise SystemExit(f"CI result review missing skip/local-proof rejection rule: {ci_result_review}")
          PY
            python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/valid_orientation_partial_unsupported > "$RESULT_ROOT/koharu-orientation-fixture-validation.json"
            python3 - <<'PY'
          import json
          with open("ci-results/koharu-orientation-fixture-validation.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          orientation = data.get("orientationMetadataSummary") or {}
          if data.get("verdict") != "contractExampleOnly":
              raise SystemExit(f"orientation fixture verdict={data.get('verdict')!r}")
          expected_partial = {"orientation-partial-vertical-linepolygon"}
          expected_unsupported = {"orientation-partial-vertical-linepolygon", "orientation-unsupported-arbitrary-rotation"}
          partial = set(orientation.get("orientationPartialTextBoxIDs") or [])
          unsupported = set(orientation.get("orientationUnsupportedTextBoxIDs") or [])
          reasons = orientation.get("orientationUnsupportedReasonBreakdown") or {}
          if not expected_partial.issubset(partial):
              raise SystemExit(f"orientation fixture missing partial IDs: {orientation}")
          if not expected_unsupported.issubset(unsupported):
              raise SystemExit(f"orientation fixture missing unsupported IDs: {orientation}")
          for key in ["linePolygonWarpUnsupported", "arbitraryRotationUnsupported"]:
              if int(reasons.get(key) or 0) <= 0:
                  raise SystemExit(f"orientation fixture missing unsupported reason {key}: {orientation}")
          PY
            python3 scripts/validate-koharu-artifacts.py --root test/koharu_artifacts --allow-missing --print-required-files
            python3 scripts/validate-koharu-artifacts.py --root test/koharu_artifacts --allow-missing > "$RESULT_ROOT/koharu-active-artifacts-validation.json"
            cat "$RESULT_ROOT/koharu-active-artifacts-validation.json"
            if [ "${{ steps.ci_scope.outputs.koharu_validator_extended_required }}" = "true" ]; then
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/coordinate_mismatch --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/invalid_bbox --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/missing_textboxes --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/schema_mismatch --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/path_escape --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/generated_by_forbidden --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/textbox_metadata_invalid --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/source_image_missing --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/source_image_sha_missing --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/source_image_sha_mismatch --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/contract_example_only_missing --expect-fail
              python3 scripts/validate-koharu-artifacts.py --root md/koharu研究/artifact_contract/examples/invalid/contract_example_only_invalid --expect-fail
            else
              echo "Skipping extended Koharu invalid fixture matrix for fast CI scope"
            fi
          } 2>&1 | tee "$RESULT_ROOT/static-checks.log"

      - name: UI interaction contract
        id: ui_interaction_contract
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -B scripts/test-v187-ui-interaction-contract.py 2>&1 | tee "$RESULT_ROOT/ui-interaction-contract.log"

      - name: v1.88 home UI contract
        id: home_ui_contract
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -B scripts/test-v188-home-ui-contract.py 2>&1 | tee "$RESULT_ROOT/v188-home-ui-contract.log"

      - name: v1.89 paste manual matrix contract
        id: v189_paste_matrix_contract
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -B scripts/test-v189-paste-manual-matrix-contract.py 2>&1 | tee "$RESULT_ROOT/v189-paste-manual-matrix-contract.log"

      - name: Xcode build
        id: xcode_build
        if: steps.ci_scope.outputs.xcode_build_required == 'true'
        timeout-minutes: 20
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$TEST_RESULTS_DIR"
          rm -rf "${{ steps.meta.outputs.result_bundle }}"
          xcodebuild \
            -project AITRANS.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "${{ steps.meta.outputs.result_bundle }}" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
          2>&1 | tee "$RESULT_ROOT/xcodebuild.log"
          exit ${PIPESTATUS[0]}

      - name: Write skipped Xcode build log
        if: steps.ci_scope.outputs.xcode_build_required != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEST_RESULTS_DIR"
          {
            echo "Xcode build skipped by fast CI scope."
            echo "reason=${{ steps.ci_scope.outputs.xcode_build_skip_reason }}"
            echo "This run changed only docs, metadata, or validator-independent files."
            echo "Choose workflow_dispatch probe_mode=ci-fast/full or change Swift/Xcode/resources/test files to force build validation."
          } > "$RESULT_ROOT/xcodebuild.log"

      - name: Capture current HEAD UI evidence
        id: ui_evidence
        if: (github.ref_name == 'codeb/v1.87-enterprise-ui' || github.ref_name == 'codeb/v1.88-home-translation-ui' || startsWith(github.ref_name, 'codeb/v1.89-')) && steps.ci_scope.outputs.xcode_build_required == 'true' && steps.xcode_build.outcome == 'success'
        timeout-minutes: 25
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            app_path="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -maxdepth 2 -name "$SCHEME.app" -type d | head -n 1)"
            if [ -z "$app_path" ]; then
              echo "Debug simulator app missing; UI evidence cannot be captured" >&2
              exit 1
            fi
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
            test -n "$bundle_id"
            scripts/capture-ui-evidence.sh \
              "$app_path" \
              "$bundle_id" \
              "$RESULT_ROOT/ui-evidence" \
              "$GITHUB_SHA"
          } 2>&1 | tee "$RESULT_ROOT/ui-evidence.log"

      - name: Locate simulator app for manga probe
        id: simulator_build
        if: steps.meta.outputs.probe_mode != 'skip' && steps.ci_scope.outputs.xcode_build_required == 'true' && steps.xcode_build.outcome == 'success' && steps.verify_model.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo "Reusing app from Xcode build output; this step must not invoke xcodebuild."
            app_path="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -maxdepth 2 -name "$SCHEME.app" -type d | head -n 1)"
            if [ -z "$app_path" ]; then
              echo "Debug simulator app not found under $DERIVED_DATA/Build/Products/Debug-iphonesimulator" >&2
              exit 1
            fi
            echo "simulatorAppReusedFromXcodeBuild=true"
            echo "simulatorAppPath=$app_path"
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
            if [ -z "$bundle_id" ]; then
              echo "Built app bundle identifier is empty" >&2
              exit 1
            fi
            echo "bundleIdentifier=$bundle_id"
            echo "simulator_app_path=$app_path" >> "$GITHUB_OUTPUT"
            echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee "$RESULT_ROOT/simulator-build.log"

      - name: Run cloud manga probe
        id: manga_probe
        if: steps.meta.outputs.probe_mode != 'skip' && steps.xcode_build.outcome == 'success' && steps.verify_model.outcome == 'success' && steps.simulator_build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            echo "Preparing simulator"
            rm -rf output
            xcrun simctl list runtimes -j > "$RESULT_ROOT/sim-runtimes.json"
            runtime_and_device="$(python3 - "$RESULT_ROOT/sim-runtimes.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          candidates = [
              r for r in data.get("runtimes", [])
              if r.get("isAvailable") and r.get("platform") == "iOS"
          ]
          if not candidates:
              raise SystemExit("No available iOS simulator runtime")
          runtime = candidates[-1]
          device_types = [
              d for d in runtime.get("supportedDeviceTypes", [])
              if d.get("productFamily") == "iPhone"
              and d.get("name", "").startswith("iPhone")
              and d.get("identifier")
          ]
          if not device_types:
              raise SystemExit(f"No iPhone device type for runtime {runtime.get('identifier')}")
          print(runtime["identifier"])
          print(device_types[0]["identifier"])
          PY
          )"
            runtime="$(echo "$runtime_and_device" | sed -n '1p')"
            device_type="$(echo "$runtime_and_device" | sed -n '2p')"
            echo "runtime=$runtime"
            echo "deviceType=$device_type"
            device_id="$(xcrun simctl create "AITRANS CI Probe" "$device_type" "$runtime")"
            echo "$device_id" > "$RESULT_ROOT/probe-device-id.txt"
            trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true; xcrun simctl delete "$device_id" >/dev/null 2>&1 || true' EXIT
            xcrun simctl boot "$device_id"
            xcrun simctl bootstatus "$device_id" -b

            app_path="${{ steps.simulator_build.outputs.simulator_app_path }}"
            BUNDLE_ID="${{ steps.simulator_build.outputs.bundle_id }}"
            if [ -z "$app_path" ]; then
              echo "Debug simulator app path is missing from locate step" >&2
              exit 1
            fi
            if [ -z "$BUNDLE_ID" ]; then
              echo "Debug simulator app bundle identifier is missing from locate step" >&2
              exit 1
            fi
            echo "Installing $app_path"
            echo "Bundled test resources:"
            find "$app_path" -maxdepth 3 \( -path '*/test*' -o -name '1.png' -o -name '1.ground_truth.json' \) -print | sort || true
            if [ ! -f "$app_path/test/1.png" ]; then
              echo "test/1.png is missing from built simulator app bundle" >&2
              exit 1
            fi
            xcrun simctl install "$device_id" "$app_path"

            container="$(xcrun simctl get_app_container "$device_id" "$BUNDLE_ID" data)"
            echo "$container" > "$RESULT_ROOT/probe-app-container.txt"
            model_dir="$container/Library/Application Support/Models/Gemma-1.5B"
            mkdir -p "$model_dir"
            cp -c "$MODEL_CACHE_DIR/$MODEL_ASSET" "$model_dir/model.gguf" 2>/dev/null || cp "$MODEL_CACHE_DIR/$MODEL_ASSET" "$model_dir/model.gguf"
            echo "Imported Release model asset=$MODEL_ASSET into legacy app model directory=$model_dir"
            echo "$MODEL_SHA256  $model_dir/model.gguf" | shasum -a 256 -c -
            wc -c "$model_dir/model.gguf"

            output_dir="$container/Library/Application Support/AITRANS/Output"
            mkdir -p "$output_dir"
            app_log="$RESULT_ROOT/app-console.log"
            xcrun simctl spawn "$device_id" log stream \
              --style compact \
              --predicate 'process == "AITRANS" OR eventMessage CONTAINS[c] "AITRANS" OR eventMessage CONTAINS[c] "llama"' \
              > "$app_log" 2>&1 &
            log_pid="$!"
            trap 'kill "$log_pid" >/dev/null 2>&1 || true; xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true; xcrun simctl delete "$device_id" >/dev/null 2>&1 || true' EXIT

            xcrun simctl spawn "$device_id" launchctl setenv AITRANS_RUN_MANGA_PROBE 1
            xcrun simctl spawn "$device_id" launchctl setenv AITRANS_MANGA_PROBE_MODE "$PROBE_MODE"
            echo "Launching manga probe"
            SIMCTL_CHILD_AITRANS_RUN_MANGA_PROBE=1 \
              SIMCTL_CHILD_AITRANS_MANGA_PROBE_MODE="$PROBE_MODE" \
              xcrun simctl launch --terminate-running-process "$device_id" "$BUNDLE_ID" \
              AITRANS_RUN_MANGA_PROBE=1 AITRANS_MANGA_PROBE_MODE="$PROBE_MODE" \
              --AITRANS_RUN_MANGA_PROBE=1 --AITRANS_MANGA_PROBE_MODE="$PROBE_MODE" \
              -AITRANS_RUN_MANGA_PROBE 1 -AITRANS_MANGA_PROBE_MODE "$PROBE_MODE"

            deadline=$((SECONDS + PROBE_TIMEOUT_SECONDS))
            report="$output_dir/probe_report.json"
            progress="$output_dir/manga_probe_progress.json"
            last_status_print=0
            last_progress_mtime=0
            launch_started_at="$SECONDS"
            stalled_progress_seconds=0
            while [ "$SECONDS" -lt "$deadline" ]; do
              if [ $((SECONDS - last_status_print)) -ge 30 ]; then
                last_status_print="$SECONDS"
                echo "Waiting for probe report; remaining=$((deadline - SECONDS))s"
                if [ -f "$progress" ]; then
                  echo "Current probe progress:"
                  cat "$progress" || true
                  progress_mtime="$(stat -f %m "$progress")"
                  if [ "$progress_mtime" = "$last_progress_mtime" ]; then
                    stalled_progress_seconds=$((stalled_progress_seconds + 30))
                    echo "Probe progress unchanged for ${stalled_progress_seconds}s"
                  else
                    last_progress_mtime="$progress_mtime"
                    stalled_progress_seconds=0
                  fi
                fi
                if [ ! -f "$progress" ] && [ "$PROBE_NO_PROGRESS_TIMEOUT_SECONDS" -gt 0 ] && [ $((SECONDS - launch_started_at)) -ge "$PROBE_NO_PROGRESS_TIMEOUT_SECONDS" ]; then
                  echo "Probe progress file was not created within ${PROBE_NO_PROGRESS_TIMEOUT_SECONDS}s" >&2
                  break
                fi
                if [ -d "$output_dir" ]; then
                  echo "Current output files:"
                  find "$output_dir" -maxdepth 1 -type f -print | sort || true
                fi
                if [ -f "$progress" ] && [ "$stalled_progress_seconds" -ge "$PROBE_STALL_TIMEOUT_SECONDS" ]; then
                  echo "Probe progress did not advance for ${stalled_progress_seconds}s" >&2
                  break
                fi
              fi
              if [ -s "$report" ]; then
                if python3 -m json.tool "$report" >/dev/null 2>&1; then
                  if python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report.get("engineUsed") != "Local GGUF":
              raise SystemExit(f"engineUsed={report.get('engineUsed')!r}")
          if int(report.get("totalBlocksDetected") or 0) <= 0:
              raise SystemExit("totalBlocksDetected <= 0")
          if not report.get("blocks"):
              raise SystemExit("blocks missing")
          PY
                  then
                    break
                  fi
                fi
              fi
              sleep 10
            done

            if [ ! -s "$report" ]; then
              echo "Final output directory snapshot before timeout:"
              if [ -d "$output_dir" ]; then
                find "$output_dir" -maxdepth 1 -type f -print -exec ls -lh {} \; | sort || true
                rm -rf output
                mkdir -p output
                cp -R "$output_dir"/. output/ || true
              else
                echo "Output directory does not exist: $output_dir"
              fi
              echo "Recent AITRANS app console log:"
              tail -n 240 "$app_log" || true
              echo "probe_report.json was not produced before timeout" >&2
              exit 1
            fi
            rm -rf output
            mkdir -p output
            cp -R "$output_dir"/. output/ || true
            python3 -m json.tool "$report" >/dev/null
            python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report.get("engineUsed") != "Local GGUF":
              raise SystemExit(f"engineUsed={report.get('engineUsed')!r}")
          if int(report.get("totalBlocksDetected") or 0) <= 0:
              raise SystemExit("totalBlocksDetected <= 0")
          if not report.get("blocks"):
              raise SystemExit("blocks missing")
          print("probe ok", "blocks=", report.get("totalBlocksDetected"), "overallPassed=", report.get("overallPassed"))
          PY
            BUNDLE_ID="$BUNDLE_ID" scripts/export-probe-output.sh "$device_id"
            python3 - <<'PY'
          import pathlib, sys
          required = [
              "probe_report.json",
              "clean_text_diagnostic.json",
              "1_ocr_probe_text.txt",
              "1_debug_boxes.png",
              "1_translated_overlay.png",
              "manga_probe_progress.json",
          ]
          if "${{ steps.meta.outputs.probe_mode }}" == "full":
              required.append("1_probe_contact_sheet.png")
          missing = [name for name in required if not pathlib.Path("output", name).is_file()]
          if missing:
              raise SystemExit(f"missing exported probe outputs: {missing}")
          import json
          report = json.load(open("output/probe_report.json", encoding="utf-8"))
          external = report.get("externalArtifactReadinessReport") or {}
          external_shadow = report.get("externalTextBoxShadowOCRReport") or {}
          contract = report.get("koharuNativeArtifactContractDryRunReport") or {}
          reconciliation = report.get("koharuArtifactIdentityReconciliationReport") or {}
          bundle = report.get("koharuNativeArtifactBundleLiteReport") or {}
          promotion = report.get("koharuNativePromotionGateLiteReport") or {}
          convergence = report.get("koharuArtifactConvergenceReport") or {}
          required_report_fields = [
              ("koharuNativeArtifactBundleLiteReport.textBoxSegmentLinkBreakdown", bundle.get("textBoxSegmentLinkBreakdown")),
              ("koharuNativeArtifactBundleLiteReport.textBoxSegmentLinkageReviewBlocks", bundle.get("textBoxSegmentLinkageReviewBlocks")),
              ("koharuNativePromotionGateLiteReport.textBoxSegmentLinkBreakdown", promotion.get("textBoxSegmentLinkBreakdown")),
              ("koharuNativePromotionGateLiteReport.textBoxSegmentLinkageBlockedBlocks", promotion.get("textBoxSegmentLinkageBlockedBlocks")),
              ("koharuArtifactIdentityReconciliationReport.enabled", reconciliation.get("enabled")),
              ("koharuArtifactIdentityReconciliationReport.fileRows", reconciliation.get("fileRows")),
              ("koharuArtifactIdentityReconciliationReport.gateLedger", reconciliation.get("gateLedger")),
              ("koharuArtifactConvergenceReport.workItemLedger", convergence.get("workItemLedger")),
              ("koharuArtifactConvergenceReport.gateLedger", convergence.get("gateLedger")),
          ]
          missing_report_fields = [name for name, value in required_report_fields if value is None]
          if missing_report_fields:
              raise SystemExit(f"missing linkage report fields: {missing_report_fields}")
          if "${{ steps.meta.outputs.koharu_artifact_requested }}" == "true":
              external_expected = {
                  "readinessVerdict": "readyForShadowOCR",
                  "activeArtifactsDirectory": True,
                  "contractExampleOnly": False,
                  "externalTextBoxesShadowOCRAllowed": True,
                  "manifestFound": True,
                  "textBoxesFound": True,
                  "bubbleMaskFound": True,
                  "segmentMaskFound": True,
              }
              mismatches = {
                  key: {"expected": expected, "actual": external.get(key)}
                  for key, expected in external_expected.items()
                  if external.get(key) != expected
              }
              if mismatches:
                  raise SystemExit(f"injected Koharu artifact not visible in App readiness report: {mismatches}")
              if external_shadow.get("executed") is not True:
                  raise SystemExit(f"externalTextBoxShadowOCRReport.executed={external_shadow.get('executed')!r}")
              if int(external_shadow.get("candidateCount") or 0) <= 0:
                  raise SystemExit(f"externalTextBoxShadowOCRReport.candidateCount={external_shadow.get('candidateCount')!r}")
              if int(external_shadow.get("ocrExecutedCount") or 0) <= 0:
                  raise SystemExit(f"externalTextBoxShadowOCRReport.ocrExecutedCount={external_shadow.get('ocrExecutedCount')!r}")
              if int(external_shadow.get("ocrSucceededCount") or 0) <= 0:
                  raise SystemExit(f"externalTextBoxShadowOCRReport.ocrSucceededCount={external_shadow.get('ocrSucceededCount')!r}")
              if contract.get("contractDryRunVerdict") != "activeArtifactsReadyForShadowOCR":
                  raise SystemExit(f"contractDryRunVerdict={contract.get('contractDryRunVerdict')!r}")
              if contract.get("activeExportAllowed") is not False or contract.get("dryRunOnly") is not True:
                  raise SystemExit("contract dry-run active export boundary was not preserved")
              receipt = external.get("artifactIdentityReceipt") or {}
              if receipt.get("identityVerdict") != "activeArtifactIdentityRecorded":
                  raise SystemExit(f"artifactIdentityReceipt.identityVerdict={receipt.get('identityVerdict')!r}")
              if receipt.get("allRequiredFilesPresent") is not True or receipt.get("allRequiredFilesHaveSHA256") is not True:
                  raise SystemExit(f"artifactIdentityReceipt files/hashes not ready: {receipt}")
              if receipt.get("sourceImageSHA256Matches") is not True:
                  raise SystemExit(f"artifactIdentityReceipt sourceImageSHA256Matches={receipt.get('sourceImageSHA256Matches')!r}: {receipt}")
              if contract.get("appSideArtifactIdentityVerdict") != "activeArtifactIdentityRecorded":
                  raise SystemExit(f"contract appSideArtifactIdentityVerdict={contract.get('appSideArtifactIdentityVerdict')!r}")
              if contract.get("appSideArtifactIdentityFilesPresent") is not True or contract.get("appSideArtifactIdentityHashesPresent") is not True:
                  raise SystemExit("contract app-side identity files/hashes are not present")
              if reconciliation.get("enabled") is not True:
                  raise SystemExit("koharuArtifactIdentityReconciliationReport missing or disabled")
              if reconciliation.get("sourceImageSHA256Matches") is not True:
                  raise SystemExit(f"identity reconciliation sourceImageSHA256Matches={reconciliation.get('sourceImageSHA256Matches')!r}: {reconciliation}")
              if reconciliation.get("readyForCIManifestComparison") is not True:
                  raise SystemExit(f"identity reconciliation not ready: {reconciliation.get('identityReconciliationVerdict')!r}")
              rows = reconciliation.get("fileRows") or []
              if len(rows) < 5:
                  raise SystemExit(f"identity reconciliation fileRows too small: {len(rows)}")
              bad_rows = [row for row in rows if row.get("comparisonStatus") != "appReceiptReady"]
              if bad_rows:
                  raise SystemExit(f"identity reconciliation rows not appReceiptReady: {bad_rows}")
              validation_path = pathlib.Path("ci-results/koharu-active-artifacts-validation.json")
              if not validation_path.is_file():
                  raise SystemExit("koharu-active-artifacts-validation.json missing for identity comparison")
              validator = json.loads(validation_path.read_text(encoding="utf-8"))
              validator_identity = validator.get("artifactIdentitySummary") or {}
              validator_source_image = validator_identity.get("sourceImage") or {}
              declared_source_sha = validator_identity.get("sourceImageSHA256Declared")
              actual_source_sha = validator_source_image.get("sha256")
              if validator_identity.get("sourceImageSHA256Matches") is not True or declared_source_sha != actual_source_sha:
                  raise SystemExit(f"validator manifest source image SHA does not match repo source image: {validator_identity}")
              artifact_files = validator_identity.get("artifactFiles") or {}
              def validator_item(kind):
                  if kind == "SourceImage":
                      return validator_identity.get("sourceImage") or {}
                  if kind == "manifest":
                      return artifact_files.get("manifest") or {}
                  return artifact_files.get(kind) or {}
              mismatches = []
              for row in rows:
                  kind = row.get("artifactKind")
                  item = validator_item(kind)
                  if item.get("sizeBytes") != row.get("appSizeBytes") or item.get("sha256") != row.get("appSHA256"):
                      mismatches.append({
                          "artifactKind": kind,
                          "validatorSize": item.get("sizeBytes"),
                          "appSize": row.get("appSizeBytes"),
                          "validatorSHA256": item.get("sha256"),
                          "appSHA256": row.get("appSHA256"),
                      })
              if mismatches:
                  raise SystemExit(f"CI validator identity does not match App receipt: {mismatches}")
          work_item_ids = {item.get("workItemID") for item in convergence.get("workItemLedger", [])}
          gate_ids = {item.get("gateID") for item in convergence.get("gateLedger", [])}
          work_items_by_id = {item.get("workItemID"): item for item in convergence.get("workItemLedger", [])}
          gates_by_id = {item.get("gateID"): item for item in convergence.get("gateLedger", [])}
          for required_id in [
              "WI-koharu-native-artifact-bundle-lite-textbox-segment-linkage",
              "WI-koharu-native-promotion-gate-lite-textbox-segment-linkage",
              "WI-koharu-artifact-identity-reconciliation",
              "WI-external-textbox-shadow-ocr-coverage",
              "WI-external-textbox-orientation-shadow-path",
          ]:
              if required_id not in work_item_ids:
                  raise SystemExit(f"missing convergence work item: {required_id}")
          for required_id in [
              "G-koharu-convergence-bundle-lite-textbox-segment-linkage",
              "G-koharu-convergence-promotion-lite-textbox-segment-linkage",
              "G-koharu-artifact-identity-reconciliation-ready",
              "G-external-textbox-shadow-ocr-coverage",
              "G-external-textbox-orientation-shadow-path",
          ]:
              if required_id not in gate_ids:
                  raise SystemExit(f"missing convergence gate: {required_id}")
          if "${{ steps.meta.outputs.koharu_artifact_requested }}" == "true":
              coverage_work_item = work_items_by_id.get("WI-external-textbox-shadow-ocr-coverage") or {}
              coverage_gate = gates_by_id.get("G-external-textbox-shadow-ocr-coverage") or {}
              report_availability_gate = gates_by_id.get("G-ci-fast-report-availability") or {}
              report_availability_signals = {
                  signal.get("name"): signal.get("value")
                  for signal in report_availability_gate.get("decisionSignals", [])
              }
              if report_availability_signals.get("requiredReportSpan") != "v1.24-v1.70":
                  raise SystemExit(f"ci-fast report availability span mismatch: {report_availability_signals}")
              if "missingReportCount" not in report_availability_signals or "missingReports" not in report_availability_signals:
                  raise SystemExit(f"ci-fast report availability missing decision signals: {report_availability_signals}")
              if coverage_work_item.get("status") != "closedReportOnly":
                  raise SystemExit(f"external shadow OCR coverage work item not closed: {coverage_work_item}")
              if coverage_work_item.get("targetBlocks"):
                  raise SystemExit(f"external shadow OCR coverage work item still has targetBlocks: {coverage_work_item.get('targetBlocks')}")
              if coverage_gate.get("status") != "passed":
                  raise SystemExit(f"external shadow OCR coverage gate not passed: {coverage_gate}")
              if coverage_gate.get("affectedBlocks"):
                  raise SystemExit(f"external shadow OCR coverage gate still has affectedBlocks: {coverage_gate.get('affectedBlocks')}")
              orientation_work_item = work_items_by_id.get("WI-external-textbox-orientation-shadow-path") or {}
              orientation_gate = gates_by_id.get("G-external-textbox-orientation-shadow-path") or {}
              if orientation_gate.get("status") == "passed" and (orientation_gate.get("affectedBlocks") or orientation_work_item.get("targetBlocks")):
                  raise SystemExit(f"orientation gate passed despite blockers: workItem={orientation_work_item} gate={orientation_gate}")
          txt = pathlib.Path("output", "1_ocr_probe_text.txt").read_text(encoding="utf-8")
          for needle in [
              "koharuNativeTextBoxDetectorLiteReport",
              "koharuNativeTextBoxDetectorLiteShadowOCRReport",
              "koharuNativeTextBoxDetectorLiteRefinementReport",
              "koharuNativeTextBoxDetectorLiteClosedLoopReport",
              "koharuNativeBubbleMaskInstanceLiteReport",
              "koharuNativeSegmentMaskRefinementLiteReport",
              "koharuNativeArtifactBundleLiteReport",
              "koharuNativePromotionGateLiteReport",
              "nativeArtifactBundleLiteTextBoxSegmentLink",
              "nativePromotionTextBoxSegmentLink",
              "convergenceBundleTextBoxSegmentLinkage",
              "convergencePromotionTextBoxSegmentLinkage",
              "koharuArtifactIdentityReconciliationReport",
              "artifactIdentityReconciliationFile",
              "convergenceArtifactIdentityReconciliation",
          ]:
              if needle not in txt:
                  raise SystemExit(f"missing probe TXT summary: {needle}")
          if "${{ steps.meta.outputs.koharu_artifact_requested }}" == "true":
              for needle in [
                  "externalArtifacts: readiness=readyForShadowOCR",
                  "shadowOCRAllowed=true",
                  "externalTextBoxShadowOCR:",
                  "ocrSucceeded=",
                  "nativeArtifactContractDryRunReport",
                  "nativeArtifactContractDryRunPreview",
                  "appSideIdentity=activeArtifactIdentityRecorded",
                  "convergenceExternalShadowOCRCoverage",
                  "convergenceExternalTextBoxOrientation",
              ]:
                  if needle not in txt:
                      raise SystemExit(f"missing injected artifact TXT summary: {needle}")
          PY
          } 2>&1 | tee "$RESULT_ROOT/manga-probe.log"

      - name: Copy available probe outputs
        id: copy_probe_outputs
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_COPY_DIR"
          if [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.manga_probe.outcome }}" = "success" ] && [ -d output ]; then
            find output -maxdepth 1 -type f \( -name '*.json' -o -name '*.txt' -o -name '*.png' \) -print -exec cp {} "$OUTPUT_COPY_DIR/" \;
          fi
          if [ ! -f "$OUTPUT_COPY_DIR/probe_report.json" ]; then
            if [ "${{ steps.meta.outputs.probe_mode }}" = "skip" ]; then
              echo "probe_mode=skip fast CI did not run cloud manga probe; trigger workflow_dispatch with ci-fast or full when probe artifacts are required" > "$OUTPUT_COPY_DIR/probe-not-run.txt"
            else
              echo "probe_report.json not available from this workflow run; cloud manga probe did not complete successfully, so checked-in output/ files were not copied into this result bundle" > "$OUTPUT_COPY_DIR/probe-not-run.txt"
            fi
          fi
          find "$OUTPUT_COPY_DIR" -maxdepth 1 -type f -print | while read -r file; do basename "$file"; done | sort > "$RESULT_ROOT/probe-output-retained-files.txt"

      - name: Write JUnit summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MODEL_STATUS="${{ steps.verify_model.outcome }}" STATIC_STATUS="${{ steps.static_checks.outcome }}" UI_INTERACTION_STATUS="${{ steps.ui_interaction_contract.outcome }}" HOME_UI_STATUS="${{ steps.home_ui_contract.outcome }}" V189_PASTE_MATRIX_STATUS="${{ steps.v189_paste_matrix_contract.outcome }}" BUILD_STATUS="${{ steps.xcode_build.outcome }}" XCODE_BUILD_REQUIRED="${{ steps.ci_scope.outputs.xcode_build_required }}" PROBE_MODE="${{ steps.meta.outputs.probe_mode }}" SIMULATOR_BUILD_STATUS="${{ steps.simulator_build.outcome }}" MANGA_PROBE_STATUS="${{ steps.manga_probe.outcome }}" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.Element("testsuite", name="AITRANS CI Results", tests="2")
          failures = 0
          model_status = os.environ["MODEL_STATUS"]
          probe_status = os.environ["MANGA_PROBE_STATUS"]
          simulator_status = os.environ["SIMULATOR_BUILD_STATUS"]
          if os.environ["PROBE_MODE"] == "skip" and model_status == "skipped":
              model_status = "success"
          if os.environ["PROBE_MODE"] == "skip" and probe_status == "skipped":
              probe_status = "success"
          if os.environ["PROBE_MODE"] == "skip" and simulator_status == "skipped":
              simulator_status = "success"
          build_status = os.environ["BUILD_STATUS"]
          if os.environ["XCODE_BUILD_REQUIRED"] != "true" and build_status == "skipped":
              build_status = "success"
          cases = [
              ("gguf-model", model_status, "GGUF model setup failed"),
              ("static-checks", os.environ["STATIC_STATUS"], "static checks failed"),
              ("ui-interaction-contract", os.environ["UI_INTERACTION_STATUS"], "v1.87 UI interaction contract failed"),
              ("v188-home-ui-contract", os.environ["HOME_UI_STATUS"], "v1.88 home UI contract failed"),
              ("xcode-build", build_status, "xcode build failed"),
              ("simulator-build", simulator_status, "simulator build failed"),
              ("manga-probe", probe_status, "manga probe failed"),
          ]
          root.set("tests", str(len(cases)))
          for name, status, message in cases:
              case = ET.SubElement(root, "testcase", classname="ci", name=name)
              if status != "success":
                  failures += 1
                  failure = ET.SubElement(case, "failure", message=message)
                  failure.text = "See logs, the .xcresult bundle, and ci-failure-summary.md."
          root.set("failures", str(failures))
          tree = ET.ElementTree(root)
          ET.indent(tree, space="  ")
          tree.write(os.path.join(os.environ["RESULT_ROOT"], "junit.xml"), encoding="utf-8", xml_declaration=True)
          PY

      - name: Write manifest
        if: always()
        shell: bash
        env:
          MANIFEST_XCODE_BUILD_REQUIRED: ${{ steps.ci_scope.outputs.xcode_build_required }}
          MANIFEST_XCODE_BUILD_SKIPPED_REASON: ${{ steps.ci_scope.outputs.xcode_build_skip_reason }}
          MANIFEST_UI_EVIDENCE_REQUIRED: ${{ (github.ref_name == 'codeb/v1.87-enterprise-ui' || github.ref_name == 'codeb/v1.88-home-translation-ui' || startsWith(github.ref_name, 'codeb/v1.89-')) && steps.ci_scope.outputs.xcode_build_required == 'true' }}
          MANIFEST_UI_EVIDENCE_OUTCOME: ${{ steps.ui_evidence.outcome }}
          MANIFEST_UI_INTERACTION_CONTRACT_OUTCOME: ${{ steps.ui_interaction_contract.outcome }}
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          probe_path=""
          clean_path=""
          ocr_text_path=""
          probe_progress_path=""
          probe_output_retained_files_path="${RESULT_ROOT}/probe-output-retained-files.txt"
          [ -f "$OUTPUT_COPY_DIR/probe_report.json" ] && probe_path="$OUTPUT_COPY_DIR/probe_report.json"
          [ -f "$OUTPUT_COPY_DIR/clean_text_diagnostic.json" ] && clean_path="$OUTPUT_COPY_DIR/clean_text_diagnostic.json"
          [ -f "$OUTPUT_COPY_DIR/1_ocr_probe_text.txt" ] && ocr_text_path="$OUTPUT_COPY_DIR/1_ocr_probe_text.txt"
          [ -f "$OUTPUT_COPY_DIR/manga_probe_progress.json" ] && probe_progress_path="$OUTPUT_COPY_DIR/manga_probe_progress.json"
          koharu_validation_path="${RESULT_ROOT}/koharu-active-artifacts-validation.json"
          [ -f "$koharu_validation_path" ] || koharu_validation_path=""
          koharu_injection_log_path="${RESULT_ROOT}/koharu-artifact-injection.log"
          [ -f "$koharu_injection_log_path" ] || koharu_injection_log_path=""
          if [ -d test/koharu_artifacts ]; then
            koharu_active_artifacts_present=true
          else
            koharu_active_artifacts_present=false
          fi
          python3 - <<PY
          import json
          from pathlib import Path

          def load_json(path):
              if not path:
                  return None
              candidate = Path(path)
              if not candidate.is_file():
                  return None
              with candidate.open("r", encoding="utf-8") as handle:
                  return json.load(handle)

          koharu_validation = load_json("$koharu_validation_path")
          probe_report = load_json("$probe_path")
          probe_progress = load_json("$probe_progress_path")
          retained_output_files = []
          retained_path = Path("$probe_output_retained_files_path")
          if retained_path.is_file():
              retained_output_files = [line.strip() for line in retained_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          external_readiness = (probe_report or {}).get("externalArtifactReadinessReport")
          external_shadow = (probe_report or {}).get("externalTextBoxShadowOCRReport")
          contract_dry_run = (probe_report or {}).get("koharuNativeArtifactContractDryRunReport")
          identity_reconciliation = (probe_report or {}).get("koharuArtifactIdentityReconciliationReport")
          convergence = (probe_report or {}).get("koharuArtifactConvergenceReport")
          app_identity_receipt = (external_readiness or {}).get("artifactIdentityReceipt") if external_readiness else None
          validator_orientation = (koharu_validation or {}).get("orientationMetadataSummary") if koharu_validation else None
          validator_identity = (koharu_validation or {}).get("artifactIdentitySummary") if koharu_validation else None
          probe_configuration = (probe_report or {}).get("configuration") or {}

          def identity_match_summary(validator_identity, reconciliation):
              rows = (reconciliation or {}).get("fileRows") or []
              artifact_files = (validator_identity or {}).get("artifactFiles") or {}
              def valid_sha(value):
                  return isinstance(value, str) and len(value) == 64 and all(ch in "0123456789abcdefABCDEF" for ch in value)
              def validator_item(kind):
                  if kind == "SourceImage":
                      return (validator_identity or {}).get("sourceImage") or {}
                  if kind == "manifest":
                      return artifact_files.get("manifest") or {}
                  return artifact_files.get(kind) or {}
              row_summaries = []
              mismatches = []
              for row in rows:
                  kind = row.get("artifactKind")
                  item = validator_item(kind)
                  app_ready = row.get("comparisonStatus") == "appReceiptReady"
                  validator_ready = item.get("exists") is True and item.get("sizeBytes") is not None and valid_sha(item.get("sha256"))
                  app_identity_ready = row.get("appSizeBytes") is not None and valid_sha(row.get("appSHA256"))
                  size_match = item.get("sizeBytes") == row.get("appSizeBytes")
                  sha_match = item.get("sha256") == row.get("appSHA256")
                  summary = {
                      "artifactKind": kind,
                      "appReceiptReady": app_ready,
                      "validatorIdentityReady": validator_ready,
                      "appIdentityReady": app_identity_ready,
                      "appSizeBytes": row.get("appSizeBytes"),
                      "validatorSizeBytes": item.get("sizeBytes"),
                      "sizeMatches": size_match,
                      "appSHA256": row.get("appSHA256"),
                      "validatorSHA256": item.get("sha256"),
                      "sha256Matches": sha_match,
                      "comparisonStatus": row.get("comparisonStatus"),
                      "ciManifestFieldPathForSize": row.get("ciManifestFieldPathForSize"),
                      "ciManifestFieldPathForSHA256": row.get("ciManifestFieldPathForSHA256"),
                  }
                  row_summaries.append(summary)
                  if not app_ready or not validator_ready or not app_identity_ready or not size_match or not sha_match:
                      mismatches.append(summary)
              if not rows:
                  verdict = "notEvaluatedNoAppReconciliationRows"
              elif not validator_identity:
                  verdict = "notEvaluatedNoValidatorIdentity"
              elif any(not row.get("appReceiptReady") for row in row_summaries):
                  verdict = "notEvaluatedAppReceiptRowsNotReady"
              elif any(not row.get("validatorIdentityReady") for row in row_summaries):
                  verdict = "notEvaluatedValidatorIdentityIncomplete"
              elif any(not row.get("appIdentityReady") for row in row_summaries):
                  verdict = "notEvaluatedAppIdentityIncomplete"
              elif mismatches:
                  verdict = "mismatch"
              else:
                  verdict = "matched"
              return {
                  "matchVerdict": verdict,
                  "rowCount": len(rows),
                  "mismatchCount": len(mismatches),
                  "rows": row_summaries,
                  "mismatches": mismatches,
              }

          identity_reconciliation_match = identity_match_summary(validator_identity, identity_reconciliation)

          def signal_map(item):
              return {
                  signal.get("name"): signal.get("value")
                  for signal in (item or {}).get("decisionSignals", [])
                  if signal.get("name")
              }

          def convergence_item_summary(kind, item_id):
              if kind == "workItem":
                  items = (convergence or {}).get("workItemLedger") or []
                  key = "workItemID"
                  fields = ["status", "targetBlocks", "remainingBlockers", "nextAction"]
              else:
                  items = (convergence or {}).get("gateLedger") or []
                  key = "gateID"
                  fields = ["status", "affectedBlocks", "recommendedAction"]
              item = next((candidate for candidate in items if candidate.get(key) == item_id), None)
              if not item:
                  return None
              summary = {key: item_id}
              for field in fields:
                  summary[field] = item.get(field)
              summary["decisionSignals"] = signal_map(item)
              return summary

          manifest = {
              "version": "${{ steps.meta.outputs.version }}",
              "branch": "${{ steps.meta.outputs.branch }}",
              "commitSha": "${GITHUB_SHA}",
              "shortSha": "${{ steps.meta.outputs.short_sha }}",
              "runId": "${GITHUB_RUN_ID}",
              "runAttempt": "${GITHUB_RUN_ATTEMPT}",
              "workflowName": "${GITHUB_WORKFLOW}",
              "createdAt": "$created_at",
              "xcodeVersion": "$xcode_version",
              "scheme": "${SCHEME}",
              "destination": "${DESTINATION}",
              "resultBundlePath": "${{ steps.meta.outputs.result_bundle }}",
              "changedFilesPath": "${RESULT_ROOT}/changed-files.txt",
              "xcodeBuildRequired": "$MANIFEST_XCODE_BUILD_REQUIRED" == "true",
              "xcodeBuildSkippedReason": "$MANIFEST_XCODE_BUILD_SKIPPED_REASON",
              "uiEvidenceRequired": "$MANIFEST_UI_EVIDENCE_REQUIRED" == "true",
              "uiEvidenceOutcome": "$MANIFEST_UI_EVIDENCE_OUTCOME",
              "uiEvidenceManifestPath": "${RESULT_ROOT}/ui-evidence/ui-evidence-manifest.json",
              "uiEvidenceLogPath": "${RESULT_ROOT}/ui-evidence.log",
              "uiInteractionContractOutcome": "$MANIFEST_UI_INTERACTION_CONTRACT_OUTCOME",
              "uiInteractionContractLogPath": "${RESULT_ROOT}/ui-interaction-contract.log",
              "koharuValidatorExtendedRequired": "${{ steps.ci_scope.outputs.koharu_validator_extended_required }}" == "true",
              "simulatorAppReusedFromXcodeBuild": "${{ steps.meta.outputs.probe_mode }}" != "skip" and "${{ steps.simulator_build.outcome }}" == "success",
              "simulatorAppPath": "${{ steps.simulator_build.outputs.simulator_app_path }}",
              "junitPath": "${RESULT_ROOT}/junit.xml",
              "xcodebuildLogPath": "${RESULT_ROOT}/xcodebuild.log",
              "simulatorBuildLogPath": "${RESULT_ROOT}/simulator-build.log",
              "mangaProbeLogPath": "${RESULT_ROOT}/manga-probe.log",
              "appConsoleLogPath": "${RESULT_ROOT}/app-console.log",
              "staticChecksLogPath": "${RESULT_ROOT}/static-checks.log",
              "koharuArtifactInjectionRequested": "${{ steps.meta.outputs.koharu_artifact_requested }}" == "true",
              "koharuArtifactInjectionRequired": "${{ steps.meta.outputs.koharu_artifact_required }}" == "true",
              "koharuArtifactInjectionStatus": "${{ steps.koharu_artifacts.outputs.status }}",
              "koharuArtifactInjectionOutcome": "${{ steps.koharu_artifacts.outcome }}",
              "koharuArtifactInjected": "${{ steps.koharu_artifacts.outputs.injected }}" == "true",
              "koharuArtifactInjectionLogPath": "$koharu_injection_log_path",
              "koharuArtifactReleaseTag": "${{ steps.meta.outputs.koharu_artifact_release_tag }}",
              "koharuArtifactAsset": "${{ steps.meta.outputs.koharu_artifact_asset }}",
              "koharuArtifactSha256": "${{ steps.meta.outputs.koharu_artifact_sha256 }}",
              "koharuArtifactValidatorLogPath": "${RESULT_ROOT}/static-checks.log",
              "koharuActiveArtifactValidationPath": "$koharu_validation_path",
              "koharuArtifactValidatorRan": "${{ steps.static_checks.outcome }}" == "success",
              "koharuActiveArtifactsDirectoryPresent": "$koharu_active_artifacts_present" == "true",
              "koharuArtifactValidation": koharu_validation,
              "koharuArtifactValidationIdentitySummary": validator_identity,
              "koharuArtifactValidationOrientationSummary": validator_orientation,
              "appSideArtifactIdentityReceiptSummary": {
                  "identityVerdict": (app_identity_receipt or {}).get("identityVerdict"),
                  "allRequiredFilesPresent": (app_identity_receipt or {}).get("allRequiredFilesPresent"),
                  "allRequiredFilesHaveSHA256": (app_identity_receipt or {}).get("allRequiredFilesHaveSHA256"),
                  "sourceImage": (app_identity_receipt or {}).get("sourceImage"),
                  "schemaVersion": (app_identity_receipt or {}).get("schemaVersion"),
                  "coordinateSpace": (app_identity_receipt or {}).get("coordinateSpace"),
                  "contractExampleOnly": (app_identity_receipt or {}).get("contractExampleOnly"),
                  "files": (app_identity_receipt or {}).get("files"),
              },
              "koharuNativeArtifactContractDryRunSummary": {
                  "enabled": (contract_dry_run or {}).get("enabled"),
                  "contractDryRunVerdict": (contract_dry_run or {}).get("contractDryRunVerdict"),
                  "appSideArtifactIdentityVerdict": (contract_dry_run or {}).get("appSideArtifactIdentityVerdict"),
                  "appSideArtifactIdentityFilesPresent": (contract_dry_run or {}).get("appSideArtifactIdentityFilesPresent"),
                  "appSideArtifactIdentityHashesPresent": (contract_dry_run or {}).get("appSideArtifactIdentityHashesPresent"),
                  "dryRunOnly": (contract_dry_run or {}).get("dryRunOnly"),
                  "activeExportAllowed": (contract_dry_run or {}).get("activeExportAllowed"),
                  "requiredFileCount": (contract_dry_run or {}).get("requiredFileCount"),
                  "contractGateCount": (contract_dry_run or {}).get("contractGateCount"),
              },
              "koharuArtifactIdentityReconciliationSummary": {
                  "enabled": (identity_reconciliation or {}).get("enabled"),
                  "identityReconciliationVerdict": (identity_reconciliation or {}).get("identityReconciliationVerdict"),
                  "appReceiptVerdict": (identity_reconciliation or {}).get("appReceiptVerdict"),
                  "contractDryRunVerdict": (identity_reconciliation or {}).get("contractDryRunVerdict"),
                  "readyForCIManifestComparison": (identity_reconciliation or {}).get("readyForCIManifestComparison"),
                  "manualCIComparisonRequired": (identity_reconciliation or {}).get("manualCIComparisonRequired"),
                  "fileRowCount": (identity_reconciliation or {}).get("fileRowCount"),
                  "comparisonStatusBreakdown": (identity_reconciliation or {}).get("comparisonStatusBreakdown"),
                  "readyFileKinds": (identity_reconciliation or {}).get("readyFileKinds"),
                  "missingFileKinds": (identity_reconciliation or {}).get("missingFileKinds"),
                  "hashMissingFileKinds": (identity_reconciliation or {}).get("hashMissingFileKinds"),
              },
              "koharuArtifactIdentityReconciliationMatch": identity_reconciliation_match,
              "externalArtifactReadinessSummary": {
                  "readinessVerdict": (external_readiness or {}).get("readinessVerdict"),
                  "activeArtifactsDirectory": (external_readiness or {}).get("activeArtifactsDirectory"),
