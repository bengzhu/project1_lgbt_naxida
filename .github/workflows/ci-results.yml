      - name: Append native-lite manifest summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("ci-results/ci-artifact-manifest.json")
          if not manifest_path.is_file():
              raise SystemExit("ci-artifact-manifest.json missing before native-lite append")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          probe_path = Path(manifest.get("probeReportPath") or "")
          probe = json.loads(probe_path.read_text(encoding="utf-8")) if probe_path.is_file() else {}
          convergence = probe.get("koharuArtifactConvergenceReport") or {}

          report_specs = {
              "detectorLite": ("koharuNativeTextBoxDetectorLiteReport", "enabled detectorLiteVerdict evaluatedBlockCount blockLedgerCount candidateCount acceptedCandidateCount shadowOCREligibleCandidateCount needsRealTextBoxesBlocks renderLockedBlocks gateCount"),
              "detectorLiteShadowOCR": ("koharuNativeTextBoxDetectorLiteShadowOCRReport", "enabled shadowOCRVerdict evaluatedBlockCount blockLedgerCount ocrExecutedCount ocrSucceededCount betterThanCurrentCount gateCount"),
              "detectorLiteRefinement": ("koharuNativeTextBoxDetectorLiteRefinementReport", "enabled refinementVerdict evaluatedBlockCount blockLedgerCount ocrExecutedCount ocrSucceededCount gateCount"),
              "detectorLiteClosedLoop": ("koharuNativeTextBoxDetectorLiteClosedLoopReport", "enabled closedLoopVerdict evaluatedBlockCount blockLedgerCount gateCount"),
              "bubbleMaskInstanceLite": ("koharuNativeBubbleMaskInstanceLiteReport", "enabled instanceLiteVerdict evaluatedBlockCount blockLedgerCount instanceCount siblingLedgerCount adjacencyLedgerCount needsRealTextBoxesBlocks needsRealBubbleMaskBlocks needsRealSegmentMaskBlocks gateCount"),
              "segmentMaskRefinementLite": ("koharuNativeSegmentMaskRefinementLiteReport", "enabled refinementLiteVerdict evaluatedBlockCount blockLedgerCount candidateLedgerCount siblingLedgerCount textBoxSegmentLinkBreakdown needsRealTextBoxesBlocks needsRealBubbleMaskBlocks needsRealSegmentMaskBlocks gateCount"),
              "artifactBundleLite": ("koharuNativeArtifactBundleLiteReport", "enabled bundleLiteVerdict evaluatedBlockCount bundleLedgerCount workItemCount gateCount textBoxSegmentLinkBreakdown textBoxSegmentLinkageReviewBlocks needsRealTextBoxesBlocks needsRealBubbleMaskBlocks needsRealSegmentMaskBlocks"),
              "promotionGateLite": ("koharuNativePromotionGateLiteReport", "enabled promotionVerdict evaluatedBlockCount blockLedgerCount stageGateCount candidateExportPreviewCount workItemCount gateCount textBoxSegmentLinkBreakdown textBoxSegmentLinkageBlockedBlocks needsRealTextBoxesBlocks needsRealBubbleMaskBlocks needsRealSegmentMaskBlocks"),
          }
          manifest["koharuNativeLiteReportSummary"] = {
              key: {field: (probe.get(report_name) or {}).get(field) for field in fields.split()}
              for key, (report_name, fields) in report_specs.items()
          }

          work_items = {item.get("workItemID"): item for item in convergence.get("workItemLedger") or []}
          gates = {item.get("gateID"): item for item in convergence.get("gateLedger") or []}

          def signals(item):
              return {
                  signal.get("name"): signal.get("value")
                  for signal in (item or {}).get("decisionSignals", [])
                  if signal.get("name")
              }

          def summarize(kind, item_id):
              item = (work_items if kind == "workItem" else gates).get(item_id)
              if not item:
                  return None
              key = "workItemID" if kind == "workItem" else "gateID"
              fields = ["status", "targetBlocks", "remainingBlockers", "nextAction"] if kind == "workItem" else ["status", "affectedBlocks", "recommendedAction"]
              summary = {key: item_id}
              summary.update({field: item.get(field) for field in fields})
              summary["decisionSignals"] = signals(item)
              return summary

          convergence_specs = {
              "detectorLiteWorkItem": ("workItem", "WI-koharu-native-textbox-detector-lite"),
              "detectorLiteGate": ("gate", "G-koharu-native-textbox-detector-lite-executed"),
              "detectorLiteShadowOCRWorkItem": ("workItem", "WI-koharu-native-textbox-detector-lite-shadow-ocr"),
              "detectorLiteShadowOCRGate": ("gate", "G-koharu-native-textbox-detector-lite-shadow-ocr-executed"),
              "detectorLiteRefinementWorkItem": ("workItem", "WI-koharu-native-textbox-detector-lite-refinement"),
              "detectorLiteRefinementGate": ("gate", "G-koharu-native-textbox-detector-lite-refinement-executed"),
              "detectorLiteClosedLoopWorkItem": ("workItem", "WI-koharu-native-textbox-detector-lite-closed-loop-router"),
              "detectorLiteClosedLoopGate": ("gate", "G-koharu-native-textbox-detector-lite-closed-loop-router-executed"),
              "bubbleMaskInstanceLiteWorkItem": ("workItem", "WI-koharu-native-bubblemask-instance-lite"),
              "bubbleMaskInstanceLiteGate": ("gate", "G-koharu-native-bubblemask-instance-lite-executed"),
              "segmentMaskRefinementLiteWorkItem": ("workItem", "WI-koharu-native-segmentmask-refinement-lite"),
              "segmentMaskRefinementLiteGate": ("gate", "G-koharu-native-segmentmask-refinement-lite-executed"),
              "artifactBundleLiteWorkItem": ("workItem", "WI-koharu-native-artifact-bundle-lite"),
              "artifactBundleLiteGate": ("gate", "G-koharu-native-artifact-bundle-lite-executed"),
              "promotionGateLiteWorkItem": ("workItem", "WI-koharu-native-promotion-gate-lite"),
              "promotionGateLiteGate": ("gate", "G-koharu-native-promotion-gate-lite-executed"),
              "bundleLiteTextBoxSegmentLinkageWorkItem": ("workItem", "WI-koharu-native-artifact-bundle-lite-textbox-segment-linkage"),
              "bundleLiteTextBoxSegmentLinkageGate": ("gate", "G-koharu-convergence-bundle-lite-textbox-segment-linkage"),
              "promotionLiteTextBoxSegmentLinkageWorkItem": ("workItem", "WI-koharu-native-promotion-gate-lite-textbox-segment-linkage"),
              "promotionLiteTextBoxSegmentLinkageGate": ("gate", "G-koharu-convergence-promotion-lite-textbox-segment-linkage"),
          }
          manifest["koharuNativeLiteConvergenceGateSummary"] = {
              key: summarize(kind, item_id)
              for key, (kind, item_id) in convergence_specs.items()
          }

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Append provenance manifest trace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path("ci-results/ci-artifact-manifest.json")
          if not manifest_path.is_file():
              raise SystemExit("ci-artifact-manifest.json missing before provenance append")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          probe_path = Path("ci-results/output/probe_report.json")
          probe = json.loads(probe_path.read_text(encoding="utf-8")) if probe_path.is_file() else {}
          external = probe.get("externalArtifactReadinessReport") or {}
          receipt = external.get("artifactIdentityReceipt") or {}
          reconciliation = probe.get("koharuArtifactIdentityReconciliationReport") or {}
          receipt_summary = manifest.setdefault("appSideArtifactIdentityReceiptSummary", {})
          receipt_summary.update({
              "sourceImageSHA256Declared": receipt.get("sourceImageSHA256Declared"),
              "sourceImageSHA256Expected": receipt.get("sourceImageSHA256Expected"),
              "sourceImageSHA256Matches": receipt.get("sourceImageSHA256Matches"),
          })
          reconciliation_summary = manifest.setdefault("koharuArtifactIdentityReconciliationSummary", {})
          reconciliation_summary.update({
              "sourceImageSHA256Declared": reconciliation.get("sourceImageSHA256Declared"),
              "sourceImageSHA256Expected": reconciliation.get("sourceImageSHA256Expected"),
              "sourceImageSHA256Matches": reconciliation.get("sourceImageSHA256Matches"),
          })
          changed_files_path = Path("ci-results/changed-files.txt")
          changed_files = []
          if changed_files_path.is_file():
              changed_files = [
                  line.strip()
                  for line in changed_files_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
          changed_files_hash = hashlib.sha256(("\n".join(changed_files) + ("\n" if changed_files else "")).encode("utf-8")).hexdigest()
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          manifest.update({
              "eventName": os.environ["GITHUB_EVENT_NAME"],
              "repository": repository,
              "ref": os.environ["GITHUB_REF"],
              "refName": os.environ["GITHUB_REF_NAME"],
              "runUrl": f"https://github.com/{repository}/actions/runs/{run_id}",
              "artifactName": "${{ steps.meta.outputs.artifact_name }}",
              "scopeDiffMethod": os.environ.get("SCOPE_DIFF_METHOD"),
              "scopeDiffBaseSha": os.environ.get("SCOPE_DIFF_BASE_SHA"),
              "scopeDiffFallbackUsed": os.environ.get("SCOPE_DIFF_FALLBACK_USED") == "true",
              "changedFilesCount": len(changed_files),
              "changedFilesSHA256": changed_files_hash,
              "changedFiles": changed_files,
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

