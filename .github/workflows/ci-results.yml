      - name: Write JUnit summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MODEL_STATUS="${{ steps.verify_model.outcome }}" STATIC_STATUS="${{ steps.static_checks.outcome }}" UI_INTERACTION_STATUS="${{ steps.ui_interaction_contract.outcome }}" UI_INTERACTION_REQUIRED="${{ steps.ci_scope.outputs.ui_interaction_contract_required }}" SPEECH_STATUS="${{ steps.speech_contract.outcome }}" SPEECH_REQUIRED="${{ steps.ci_scope.outputs.speech_contract_required }}" HOME_UI_STATUS="${{ steps.home_ui_contract.outcome }}" HOME_UI_REQUIRED="${{ steps.ci_scope.outputs.home_ui_contract_required }}" V189_PASTE_MATRIX_STATUS="${{ steps.v189_paste_matrix_contract.outcome }}" V189_PASTE_MATRIX_REQUIRED="${{ steps.ci_scope.outputs.paste_matrix_contract_required }}" UI_EVIDENCE_STATUS="${{ steps.ui_evidence.outcome }}" UI_EVIDENCE_REQUIRED="${{ steps.ci_scope.outputs.ui_evidence_required }}" BUILD_STATUS="${{ steps.xcode_build.outcome }}" XCODE_BUILD_REQUIRED="${{ steps.ci_scope.outputs.xcode_build_required }}" PROBE_MODE="${{ steps.meta.outputs.probe_mode }}" SIMULATOR_BUILD_STATUS="${{ steps.simulator_build.outcome }}" MANGA_PROBE_STATUS="${{ steps.manga_probe.outcome }}" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.Element("testsuite", name="AITRANS CI Results", tests="2")
          failures = 0
          model_status = os.environ["MODEL_STATUS"]
          probe_status = os.environ["MANGA_PROBE_STATUS"]
          simulator_status = os.environ["SIMULATOR_BUILD_STATUS"]
          if os.environ["PROBE_MODE"] == "skip" and model_status == "skipped":
              model_status = "success"
          if os.environ["PROBE_MODE"] == "skip" and probe_status == "skipped":
              probe_status = "success"
          if os.environ["PROBE_MODE"] == "skip" and simulator_status == "skipped":
              simulator_status = "success"
          build_status = os.environ["BUILD_STATUS"]
          if os.environ["XCODE_BUILD_REQUIRED"] != "true" and build_status == "skipped":
              build_status = "success"
          def scoped_status(status, required):
              if required != "true" and status == "skipped":
                  return "success"
              return status
          cases = [
              ("gguf-model", model_status, "GGUF model setup failed"),
              ("static-checks", os.environ["STATIC_STATUS"], "static checks failed"),
              ("speech-recognition-contract", scoped_status(os.environ.get("SPEECH_STATUS", "skipped"), os.environ["SPEECH_REQUIRED"]), "speech recognition contract failed"),
              ("ui-interaction-contract", scoped_status(os.environ["UI_INTERACTION_STATUS"], os.environ["UI_INTERACTION_REQUIRED"]), "v1.87 UI interaction contract failed"),
              ("v188-home-ui-contract", scoped_status(os.environ["HOME_UI_STATUS"], os.environ["HOME_UI_REQUIRED"]), "v1.88 home UI contract failed"),
              ("v189-paste-matrix-contract", scoped_status(os.environ["V189_PASTE_MATRIX_STATUS"], os.environ["V189_PASTE_MATRIX_REQUIRED"]), "v1.89 paste matrix contract failed"),
              ("xcode-build", build_status, "xcode build failed"),
              ("ui-evidence", scoped_status(os.environ["UI_EVIDENCE_STATUS"], os.environ["UI_EVIDENCE_REQUIRED"]), "UI evidence failed"),
              ("simulator-build", simulator_status, "simulator build failed"),
              ("manga-probe", probe_status, "manga probe failed"),
          ]
          root.set("tests", str(len(cases)))
          for name, status, message in cases:
              case = ET.SubElement(root, "testcase", classname="ci", name=name)
              if status != "success":
                  failures += 1
                  failure = ET.SubElement(case, "failure", message=message)
                  failure.text = "See logs, the .xcresult bundle, and ci-failure-summary.md."
          root.set("failures", str(failures))
          tree = ET.ElementTree(root)
          ET.indent(tree, space="  ")
          tree.write(os.path.join(os.environ["RESULT_ROOT"], "junit.xml"), encoding="utf-8", xml_declaration=True)
          PY

