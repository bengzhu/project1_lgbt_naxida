      - name: Write failure summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# AITRANS CI Failure Summary"
            echo
            echo "- branch: ${{ steps.meta.outputs.branch }}"
            echo "- commitSha: ${CI_COMMIT_SHA}"
            echo "- runId: ${GITHUB_RUN_ID}"
            echo "- runAttempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- runUrl: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- eventName: ${GITHUB_EVENT_NAME}"
            echo "- ref: ${GITHUB_REF}"
            echo "- repository: ${GITHUB_REPOSITORY}"
            echo "- artifact: ${{ steps.meta.outputs.artifact_name }}"
            echo "- scope diff method: ${{ steps.ci_scope.outputs.scope_diff_method }}"
            echo "- scope diff base sha: ${{ steps.ci_scope.outputs.scope_diff_base_sha }}"
            echo "- scope diff fallback used: ${{ steps.ci_scope.outputs.scope_diff_fallback_used }}"
            if [ -f "${RESULT_ROOT}/changed-files.txt" ]; then
              changed_count="$(wc -l < "${RESULT_ROOT}/changed-files.txt" | tr -d '[:space:]')"
              changed_hash="$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path("ci-results/changed-files.txt")
          lines = [line.strip() for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(hashlib.sha256(("\n".join(lines) + ("\n" if lines else "")).encode("utf-8")).hexdigest())
          PY
          )"
              echo "- changed files: ${changed_count}"
              echo "- changed files sha256: ${changed_hash}"
            fi
            echo "- probe mode: ${{ steps.meta.outputs.probe_mode }}"
            echo "- probe timeout seconds: ${{ steps.meta.outputs.probe_timeout_seconds }}"
