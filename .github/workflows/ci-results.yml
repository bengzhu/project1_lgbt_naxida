          print(f"- externalTextBoxesShadowOCRAllowed: {data.get('externalTextBoxesShadowOCRAllowed')}")
          print(f"- nextAction: {data.get('nextAction')}")
          print(f"- readinessBlockers: {data.get('readinessBlockers')}")
          PY
            else
              echo "- active artifact validator output missing; inspect static checks."
            fi
            echo
            if { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.verify_model.outcome }}" != "success" ]; } || [ "${{ steps.static_checks.outcome }}" != "success" ] || { [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.xcode_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.simulator_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.manga_probe.outcome }}" != "success" ]; }; then
              echo "## Return to Agent B"
              echo "Fix the failed stage above, then push a new commit to the same codeb/... branch. Agent C must discard older run artifacts after a new push."
            else
              echo "## Result"
              if [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ]; then
                echo "Static checks and Xcode build passed. Agent C still needs to inspect the diff, manifest, logs, and available output artifacts."
              else
                echo "Static checks passed. Xcode build was skipped by scope detection; Agent C must not treat this run as Swift/Xcode compile evidence."
              fi
            fi
          } > "$RESULT_ROOT/ci-failure-summary.md"

      - name: Upload CI result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ci-results
          retention-days: 14

      - name: Fail job if checks failed
        if: always()
        shell: bash
        run: |
          if { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.verify_model.outcome }}" != "success" ]; } || [ "${{ steps.static_checks.outcome }}" != "success" ] || { [ "${{ steps.ci_scope.outputs.xcode_build_required }}" = "true" ] && [ "${{ steps.xcode_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.simulator_build.outcome }}" != "success" ]; } || { [ "${{ steps.meta.outputs.probe_mode }}" != "skip" ] && [ "${{ steps.manga_probe.outcome }}" != "success" ]; }; then
            echo "CI result bundle uploaded; failing job because at least one required stage failed."
            exit 1
          fi
