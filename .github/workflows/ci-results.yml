        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path("ci-results/ci-artifact-manifest.json")
          if not manifest_path.is_file():
              raise SystemExit("ci-artifact-manifest.json missing before provenance append")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          probe_path = Path("ci-results/output/probe_report.json")
          probe = json.loads(probe_path.read_text(encoding="utf-8")) if probe_path.is_file() else {}
          external = probe.get("externalArtifactReadinessReport") or {}
          receipt = external.get("artifactIdentityReceipt") or {}
          reconciliation = probe.get("koharuArtifactIdentityReconciliationReport") or {}
          receipt_summary = manifest.setdefault("appSideArtifactIdentityReceiptSummary", {})
          receipt_summary.update({
              "sourceImageSHA256Declared": receipt.get("sourceImageSHA256Declared"),
              "sourceImageSHA256Expected": receipt.get("sourceImageSHA256Expected"),
              "sourceImageSHA256Matches": receipt.get("sourceImageSHA256Matches"),
          })
          reconciliation_summary = manifest.setdefault("koharuArtifactIdentityReconciliationSummary", {})
          reconciliation_summary.update({
              "sourceImageSHA256Declared": reconciliation.get("sourceImageSHA256Declared"),
              "sourceImageSHA256Expected": reconciliation.get("sourceImageSHA256Expected"),
              "sourceImageSHA256Matches": reconciliation.get("sourceImageSHA256Matches"),
          })
          changed_files_path = Path("ci-results/changed-files.txt")
          changed_files = []
          if changed_files_path.is_file():
              changed_files = [
                  line.strip()
                  for line in changed_files_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
          changed_files_hash = hashlib.sha256(("\n".join(changed_files) + ("\n" if changed_files else "")).encode("utf-8")).hexdigest()
          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          manifest.update({
              "eventName": os.environ["GITHUB_EVENT_NAME"],
              "repository": repository,
              "ref": os.environ["GITHUB_REF"],
              "refName": os.environ["GITHUB_REF_NAME"],
              "runUrl": f"https://github.com/{repository}/actions/runs/{run_id}",
              "artifactName": "${{ steps.meta.outputs.artifact_name }}",
              "scopeDiffMethod": os.environ.get("SCOPE_DIFF_METHOD"),
              "scopeDiffBaseSha": os.environ.get("SCOPE_DIFF_BASE_SHA"),
              "scopeDiffFallbackUsed": os.environ.get("SCOPE_DIFF_FALLBACK_USED") == "true",
              "changedFilesCount": len(changed_files),
              "changedFilesSHA256": changed_files_hash,
              "changedFiles": changed_files,
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

