name: Koharu MIT48 reference parity

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: "Optional commit SHA that must be checked out"
        required: false
        type: string

permissions:
  contents: read

jobs:
  mit48-reference-parity:
    name: Cloud MIT48 artifact and reference smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned Koharu reference source
        uses: actions/checkout@v4
        with:
          repository: mayocream/koharu
          ref: 35f3e6d1a418d9617fd922e2bc865fe5b8fff818
          path: reference/koharu-main
          fetch-depth: 1

      - name: Verify requested commit
        if: inputs.expected_commit_sha != ''
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit_sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cloud smoke dependencies
        run: python -m pip install --disable-pip-version-check "huggingface_hub<1" "Pillow>=10,<12"

      - name: Download, build and run Koharu MIT48 reference
        env:
          KOHARU_MIT48_OUTPUT_ROOT: ${{ runner.temp }}/koharu-mit48-output
          KOHARU_MIT48_ARTIFACT_ROOT: ${{ runner.temp }}/koharu-mit48-model
          KOHARU_MIT48_CARGO_TARGET_DIR: ${{ runner.temp }}/koharu-mit48-cargo
        run: bash scripts/run-koharu-mit48px-cloud-smoke.sh

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koharu-mit48-reference-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/koharu-mit48-output
          if-no-files-found: warn
          retention-days: 14
